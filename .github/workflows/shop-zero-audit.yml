name: Zero Shop residual audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map active vs retired commerce callsites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')

          tokens=[
            'renderWallet','showCouponWallet','giftsData','xsShopCardEsc','xsHasRealShopCardHtml',
            'xsProductFromShareMessage','xsShopCardTagFromMessage','xsRenderShopCardFromMessage',
            'isShopCardMessage','safeShopHtml','data-shop-card','xs-shop-share-card','shop-chat-card',
            'ta-phone-product-card','order-product','productData','orderData','shareData','couponData','giftData',
            'xiaoshu-coupon-chat-card','xiaoshu-coupon-tab','xs-gift-time-line'
          ]
          print('=== counts ===')
          for t in tokens:
            c=s.count(t)
            if c: print(repr(t), c)

          def contexts(token, limit=20, radius=650):
            print(f'\n=== contexts: {token} ===')
            seen=set(); n=0
            for m in re.finditer(re.escape(token), s):
              w=s[max(0,m.start()-radius):min(len(s),m.end()+radius)].replace('\n',' ')
              w=re.sub(r'\s+',' ',w)
              if w in seen: continue
              seen.add(w)
              print(w)
              n+=1
              if n>=limit: break

          for t in ['renderWallet','giftsData','xsShopCardEsc','xsProductFromShareMessage','xsRenderShopCardFromMessage','isShopCardMessage','safeShopHtml','xiaoshu-coupon-chat-card']:
            contexts(t, 25)

          # Print complete named function bodies where safe and bounded.
          names=['xsShopCardEsc','xsWhitelistedChatCardKind','xsHasRealShopCardHtml','xsGetChatCardKind','xsProductFromShareMessage','xsShopCardTagFromMessage','xsRenderShopCardFromMessage','isShopCardMessage','safeShopHtml']
          for name in names:
            print(f'\n=== function block: {name} ===')
            m=re.search(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',s)
            if not m:
              print('NOT FOUND'); continue
            start=m.start(); i=m.end()-1; depth=0; quote=None; esc=False
            while i<len(s):
              ch=s[i]
              if quote:
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch==quote: quote=None
              else:
                if ch in "'\"`": quote=ch
                elif ch=='{': depth+=1
                elif ch=='}':
                  depth-=1
                  if depth==0:
                    print(s[start:i+1]); break
              i+=1
            else: print('UNTERMINATED')

          raise SystemExit('mapping complete (intentional red)')
          PY
name: Apply chat stability fix v2

on:
  push:
    branches: [repair-chat-20260920]
    paths:
      - '.github/workflows/apply-chat-stability-fix-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, got {n}')
              s=s.replace(old,new,1); print('PATCH',label)

          one("""function bigKeyboardStickerPool(){
          var pool=[];
          try{
          if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool();
          else if(typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool();
          else if(Array.isArray(window._stickerLibrary))pool=window._stickerLibrary;
          }catch(e){pool=[];}
          var seen=new Set();
          return (Array.isArray(pool)?pool:[]).map(function(x){return String(x||'').trim();}).filter(function(x){if(!x||seen.has(x))return false;seen.add(x);return true;});
          }""","""function bigKeyboardStickerPool(){
          var pool=[];
          try{
          if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool()||[];
          if((!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool()||[];
          if((!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary))pool=window._stickerLibrary;
          }catch(e){pool=[];}
          var seen=new Set();
          return (Array.isArray(pool)?pool:[]).map(function(x){return String(x||'').trim();}).filter(function(x){if(!x||seen.has(x))return false;seen.add(x);return true;});
          }""",'parent bridge empty fallback')

          one("if(!sharedStickerPool.length){if(!grid.firstChild){const empty=document.createElement('div');empty.className='kb-sticker-empty';empty.textContent='暂无';grid.appendChild(empty);}return;}","""if(!sharedStickerPool.length){
          try{
          if(window.parent&&window.parent!==window){
          let parentPool=[];
          if(window.parent.xiaoshuStickerStore&&typeof window.parent.xiaoshuStickerStore.getPool==='function')parentPool=window.parent.xiaoshuStickerStore.getPool()||[];
          if((!Array.isArray(parentPool)||!parentPool.length)&&typeof window.parent.xiaoshuGetSharedStickerPool==='function')parentPool=window.parent.xiaoshuGetSharedStickerPool()||[];
          if((!Array.isArray(parentPool)||!parentPool.length)&&Array.isArray(window.parent._stickerLibrary))parentPool=window.parent._stickerLibrary;
          sharedStickerPool=normalizeSharedStickerPool(parentPool);
          }
          }catch(_e){}
          }
          if(!sharedStickerPool.length){requestSharedStickerPool();if(!grid.firstChild){const empty=document.createElement('div');empty.className='kb-sticker-empty';empty.textContent='暂无';grid.appendChild(empty);}return;}""",'Chat2 direct-parent recovery')

          pat=re.compile(r"(  function appendStickerBatch\(\)\{.*?grid\.appendChild\(frag\);pending\.forEach\(function\(img\)\{queueStickerThumb\(img,img\.__stickerSrc,false\);\}\);\n  \})",re.S)
          if len(list(pat.finditer(s)))!=1: raise SystemExit('Chat1 append target mismatch')
          helper="""
          function scheduleStickerGridFill(generation){
            if(generation!==stickerLoadGeneration)return;
            var grid=document.querySelector('#combo-content-area .xs-final-sticker-grid');
            if(!grid||!grid.isConnected||stickerRenderedCount>=stickerPool.length)return;
            appendStickerBatch();
            if(generation!==stickerLoadGeneration||stickerRenderedCount>=stickerPool.length)return;
            var next=function(){scheduleStickerGridFill(generation);};
            if(typeof window.requestIdleCallback==='function')window.requestIdleCallback(next,{timeout:120});else setTimeout(next,16);
          }"""
          s=pat.sub(lambda m:m.group(1)+helper,s,count=1); print('PATCH Chat1 progressive background fill')
          one("if(grid){appendStickerBatch();bindStickerGrid(grid,a);}","if(grid){appendStickerBatch();bindStickerGrid(grid,a);scheduleStickerGridFill(stickerLoadGeneration);}",'Chat1 progressive activation')

          one("try{if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool()||[];else if(typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool()||[]}catch(e){pool=[]}","try{if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool()||[];if((!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool()||[];if((!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary))pool=window._stickerLibrary}catch(e){pool=[]}",'automatic sticker fallback')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,subprocess
          s=Path('index.html').read_text(encoding='utf-8'); fail=[]
          def ck(x,msg): print(('PASS ' if x else 'FAIL ')+msg); fail.append(msg) if not x else None
          pack=r'<script[^>]+id=["\']xiaoshu-builtin-sticker-packs-data-v1["\'][^>]*>(.*?)</script>'
          m=re.search(pack,s,re.S|re.I); data=json.loads(m.group(1)) if m else []
          refs=[str(i.get('src','')).strip() for p in data for i in (p.get('items') or []) if isinstance(i,dict) and str(i.get('src','')).strip()]
          old=subprocess.check_output(['git','show','bd884979aec7822e1fd307b3fc1a593942f2082d:index.html'],text=True,encoding='utf-8',errors='replace')
          hm=re.search(pack,old,re.S|re.I); hd=json.loads(hm.group(1)) if hm else []
          hist=[str(i.get('src','')).strip() for p in hd for i in (p.get('items') or []) if isinstance(i,dict) and str(i.get('src','')).strip()]
          assets=[x for x in Path('assets/stickers').glob('*') if x.is_file() and x.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp'}]
          wanted_names={Path(x).name for x in refs}; asset_names={x.name for x in assets}; extras=asset_names-wanted_names
          print('INFO physical asset files=',len(assets),'unique filenames=',len(asset_names),'wanted basenames=',len(wanted_names),'excluded extras=',len(extras))
          ck(len(refs)==496 and len(set(refs))==496,'496 wanted refs remain unique')
          ck(refs==hist,'496 refs exactly match historical wanted corpus')
          ck(all(Path(x).is_file() for x in refs),'every wanted one of 496 exists on disk')
          ck(len(extras)==119,'exactly 119 physical stickers stay outside wanted corpus')
          ck('function scheduleStickerGridFill(generation)' in s and 'scheduleStickerGridFill(stickerLoadGeneration)' in s,'Chat1 progressively fills remaining stickers without user scroll')
          ck('if(grid){appendStickerBatch();bindStickerGrid(grid,a);}' not in s,'Chat1 old one-batch-only activation removed')
          ck('while(stickerRenderedCount<stickerPool.length)appendStickerBatch();' not in s,'Chat1 avoids synchronous all-496 injection')
          parent=re.search(r'function bigKeyboardStickerPool\(\)\{.*?\n\}',s,re.S); pt=parent.group(0) if parent else ''
          ck("(!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function'" in pt and "(!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary)" in pt,'Chat2 parent bridge falls through empty primary pool')
          ck('sharedStickerPool=normalizeSharedStickerPool(parentPool);' in s and "if(!sharedStickerPool.length){requestSharedStickerPool();" in s,'Chat2 self-heals before/while empty state')
          ck('while(sharedStickerRenderedCount<sharedStickerPool.length)appendSharedStickerBatch();' in s,'Chat2 renders full received pool')
          ck("raw.startsWith('assets/stickers/')||raw.startsWith('./assets/stickers/')" in s,'Chat2 permits bundled sticker paths')
          auto=re.search(r'window\.xiaoshuSendPartnerStickerNow=function\(\).*?function mount\(\)',s,re.S); at=auto.group(0) if auto else ''
          ck("(!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function'" in at and "(!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary)" in at,'automatic sticker sending survives empty primary store')
          bm=re.search(r'<script id="xiaoshu-builtin-bubble-css-data" type="application/json">(.*?)</script>',s,re.S); km=re.search(r'const BUILTIN_KEYBOARD_BEAUTY_STYLES=(\[.*?\]);\s*let editingKeyboardBeautyId',s,re.S)
          a=json.loads(bm.group(1)) if bm else []; b=json.loads(km.group(1)) if km else []
          ck(len(a)==18 and len(b)==18 and [x.get('name') for x in a]==[x.get('name') for x in b],'Chat1/Chat2 beauty stays synchronized at 18 themes')
          ck(s.count("writeEventOnce(call,'fa-phone-slash','我已拒绝','')")==1,'拒绝来电 remains 我已拒绝')
          ck(s.count('.call-event-message{display:flex!important;align-items:center!important;justify-content:center!important;')==1,'call event remains centered')
          ck(len(s)>1500000 and '<html' in s and '</html>' in s,'index structural sanity')
          if fail: raise SystemExit('FAILED: '+', '.join(fail))
          print('ALL REQUIREMENT CHECKS PASSED')
          PY
      - name: Commit verified repair
        shell: bash
        run: |
          git diff --check
          git diff --quiet -- index.html && { echo 'No index change' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: stabilize shared stickers across both chats'
          git push origin HEAD:repair-chat-20260920

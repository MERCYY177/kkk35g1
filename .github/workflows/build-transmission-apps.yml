name: Build Three Transmission Android Apps

on:
  push:
    branches: [main]
    paths:
      - "android-apps/**"
      - ".github/workflows/build-transmission-apps.yml"
      - "index.html"
      - "*.js"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Bundle the complete web app locally
        run: |
          set -eux
          mkdir -p android-apps/app/src/main/assets/site
          cp index.html android-apps/app/src/main/assets/site/
          find . -maxdepth 1 -type f -name '*.js' -exec cp {} android-apps/app/src/main/assets/site/ \;
          if [ -d assets ]; then cp -R assets android-apps/app/src/main/assets/site/; fi
          test -s android-apps/app/src/main/assets/site/index.html
          du -sh android-apps/app/src/main/assets/site
          find android-apps/app/src/main/assets/site -maxdepth 2 -type f | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build all three APKs
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleStandardDebug :app:assembleDarkfixDebug :app:assembleThirdDebug

      - name: Prepare and verify APK files
        run: |
          set -eux
          mkdir -p release-apks
          cp android-apps/app/build/outputs/apk/standard/debug/app-standard-debug.apk release-apks/传讯1.apk
          cp android-apps/app/build/outputs/apk/darkfix/debug/app-darkfix-debug.apk release-apks/传讯2.apk
          cp android-apps/app/build/outputs/apk/third/debug/app-third-debug.apk release-apks/传讯3.apk
          test -s release-apks/传讯1.apk
          test -s release-apks/传讯2.apk
          test -s release-apks/传讯3.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs release-apks/传讯1.apk
          "$APKSIGNER" verify --verbose --print-certs release-apks/传讯2.apk
          "$APKSIGNER" verify --verbose --print-certs release-apks/传讯3.apk
          sha256sum release-apks/*.apk | tee release-apks/SHA256SUMS.txt
          ls -lh release-apks

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: 传讯1-2-3-已验证安装包
          path: release-apks/*
          if-no-files-found: error
          retention-days: 30

name: Diagnose chat repair targets

on:
  push:
    branches: [repair-chat-20260920]
    paths:
      - '.github/workflows/diagnose-chat-repair.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RED - inspect exact sticker data flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          print('index chars',len(s))

          def around(label, marker, before=300, after=8000):
              print('\n===== '+label+' =====')
              i=s.find(marker)
              if i<0:
                  print('MISSING',marker)
                  return ''
              a=max(0,i-before); b=min(len(s),i+after)
              text=s[a:b]
              print(text)
              return text

          pack=re.search(r'<script[^>]+id=["\']xiaoshu-builtin-sticker-packs-data-v1["\'][^>]*>(.*?)</script>',s,re.S|re.I)
          data=json.loads(pack.group(1)) if pack else []
          refs=[str(i.get('src','')).strip() for p in data for i in (p.get('items') or []) if isinstance(i,dict) and str(i.get('src','')).strip()]
          print('builtin sticker refs',len(refs),'unique',len(set(refs)))

          # Chat1: exact batch size and scroll-loading code.
          for marker in ['STICKER_BATCH_SIZE','function appendStickerBatch(){','function bindStickerGrid(grid,scrollBox){','if(grid){appendStickerBatch();bindStickerGrid(grid,a);}']:
              around('Chat1 '+marker,marker,200,12000)

          # Shared store and parent->iframe bridge.
          for marker in ['window.xiaoshuStickerStore','function bigKeyboardStickerPool(){','function sendBigKeyboardStickers(frame){','xiaoshu-big-keyboard-stickers-state','normalizeSharedStickerPool(data.stickers)','function safeResourceUrl(','xiaoshuBigKeyboardFrame']:
              around('Bridge '+marker,marker,300,12000)

          # Count all load bindings involving the big keyboard frame and all message-state handlers.
          print('\n===== Bridge token counts =====')
          for token in ['sendBigKeyboardStickers(frame)','sendBigKeyboardStorage(frame)','normalizeSharedStickerPool(data.stickers)',"data.type==='xiaoshu-big-keyboard-stickers-state'",'safeResourceUrl(src,\'image\')']:
              print(token,s.count(token))

          # Runtime-equivalent static simulation: reproduce canonical pool + safe-resource filtering where possible.
          sm=re.search(r'function safeResourceUrl\((.*?)\)\{(.*?)\n\}',s,re.S)
          if sm: print('\nSAFE RESOURCE FUNCTION MATCH:\n',sm.group(0)[:10000])

          # Existing product fixes that must survive.
          m=re.search(r'<script id="xiaoshu-builtin-bubble-css-data" type="application/json">(.*?)</script>',s,re.S)
          k=re.search(r'const BUILTIN_KEYBOARD_BEAUTY_STYLES=(\[.*?\]);\s*let editingKeyboardBeautyId',s,re.S)
          a=json.loads(m.group(1)) if m else []; b=json.loads(k.group(1)) if k else []
          print('\nbeauty chat1/chat2',len(a),len(b),'same names', [x.get('name') for x in a]==[x.get('name') for x in b])
          print('reject copy',s.count("writeEventOnce(call,'fa-phone-slash','我已拒绝','')"))
          print('center wrapper',s.count('.call-event-message{display:flex!important;align-items:center!important;justify-content:center!important;'))
          print('auto sender uses canonical pool',bool(re.search(r'window\.xiaoshuSendPartnerStickerNow=function\(\).*?xiaoshuStickerStore\.getPool\(\)',s,re.S)))

          # RED conditions mirroring the user's actual report.
          failures=[]
          if 'if(grid){appendStickerBatch();bindStickerGrid(grid,a);}' in s:
              failures.append('Chat1 begins with only one batch and relies on scroll loader')
          if len(refs)!=496 or len(set(refs))!=496:
              failures.append('canonical pool is not 496 unique')
          # Chat2 showing 暂无 can only happen when sharedStickerPool is empty, so trace its receiving path above.
          if 'empty.textContent=\'暂无\'' in s or 'empty.textContent="暂无"' in s:
              failures.append('Chat2 empty state is reachable whenever bridge yields empty pool')
          print('\nRED failures:',failures)
          raise SystemExit('RED diagnostic complete')
          PY

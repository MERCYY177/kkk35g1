name: Deploy v4.6 two regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v4-6-two-regressions.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact v4.5 base
        shell: bash
        run: |
          actual="$(git hash-object index.html)"
          expected="ba27c736ab3111b2ee278a8fd8f9f5f97ba58386"
          echo "base index blob: $actual"
          test "$actual" = "$expected" || { echo "Refusing to patch unexpected index.html"; exit 1; }

      - name: Apply v4.6 patch
        shell: bash
        run: |
          git apply --check .github/patches/v46-two-regressions.patch
          git apply .github/patches/v46-two-regressions.patch

      - name: Verify v4.6 behavior
        shell: bash
        run: |
          actual="$(git hash-object index.html)"
          expected="0b390284d00fda765b6c587be632aa85eb277e6b"
          echo "target index blob: $actual"
          test "$actual" = "$expected" || { echo "Patched index.html does not match verified v4.6 target"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'shouldAllowSupplementalReply: shouldAllowSupplementalReply' in s
          assert "if (!__xsUserJustSentSticker && __xsAllowSupplementalReply && Math.random() < 0.03)" in s
          assert "const shouldSendSticker = enabledStickerPool.length > 0 && __xsAllowSupplementalReply" in s
          assert "if(target.id==='xs-fixed-card-reply-count'){cancelPendingReplyTasks();" in s
          assert "const __xsShouldTriggerReply = !extraMedia || !extraMedia.mediaTotal || extraMedia.mediaIndex === extraMedia.mediaTotal - 1;" in s
          assert "settings.showPartnerNameInChat || showPartnerNameInChat" not in s
          assert "document.body.classList.toggle('show-partner-name', !!settings.showPartnerNameInChat);" in s
          assert "msg.sender !== null && settings.showPartnerNameInChat)" in s
          print('v4.6 invariants OK')
          PY
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)
          for i,(attrs,code) in enumerate(blocks):
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              m=re.search(r'\btype\s*=\s*["\']([^"\']+)',attrs,re.I)
              if m and m.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
              if not code.strip(): continue
              p=Path('/tmp')/f'xs-{i}.js'; p.write_text(code,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr); sys.exit(1)
          print('JS syntax OK')
          PY

      - name: Commit v4.6 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No change to commit"; exit 1; }
          git commit -m "更新v4.6：修复固定回复条数和名字开关"
          git push origin HEAD:main

name: Diagnose sticker recovery

on:
  push:
    paths:
      - '.github/workflows/diag-sticker-recovery.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit sticker assets, code and history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, subprocess

          def sh(*args):
              return subprocess.check_output(args, text=True, errors='replace').strip()

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          assets = sorted(x.as_posix() for x in Path('assets/stickers').glob('*') if x.is_file())
          print('=== CURRENT ===')
          print('HEAD', sh('git','rev-parse','HEAD'))
          print('sticker_asset_files', len(assets))
          pref = Counter(Path(x).name.split('_',1)[0] for x in assets)
          print('asset_prefix_counts', dict(sorted(pref.items())))
          print('first_assets', assets[:8])
          print('last_assets', assets[-8:])

          refs = re.findall(r"assets/stickers/[A-Za-z0-9_.-]+", text)
          uniq_refs = sorted(set(refs))
          print('code_asset_refs_total', len(refs), 'unique', len(uniq_refs))
          missing = sorted(set(uniq_refs) - set(assets))
          unreferenced = sorted(set(assets) - set(uniq_refs))
          print('missing_referenced_assets', len(missing), missing[:80])
          print('unreferenced_assets', len(unreferenced), unreferenced[:80])

          needles = [
              'xiaoshuStickerStore','xiaoshuBuiltinStickerPacks','builtinSrcs','getPool','buildPool',
              'xiaoshuGetSharedStickerPool','xiaoshuProactiveStickerStore','xs_proactive_stickers',
              '聊天2','聊天 2','chat2','chat-2','chat2-sticker','sticker-panel','sticker-picker',
              'custom-sticker','customSticker','stickerPack','sticker-pack'
          ]
          print('=== IDENTIFIER COUNTS ===')
          for n in needles:
              print(n, text.count(n))

          keys = sorted(set(re.findall(r"['\"]([^'\"]*sticker[^'\"]*)['\"]", text, flags=re.I)))
          print('=== STICKER STRING KEYS ===')
          for k in keys[:250]: print(k)

          print('=== CONTEXTS ===')
          for n in ['xiaoshuStickerStore','xiaoshuBuiltinStickerPacks','builtinSrcs','xiaoshuProactiveStickerStore','xs_proactive_stickers','聊天2','chat2']:
              pos = 0; shown = 0
              while shown < 8:
                  i = text.find(n, pos)
                  if i < 0: break
                  a=max(0,i-500); b=min(len(text),i+1200)
                  snippet=text[a:b].replace('\n','\\n')
                  print(f'CTX {n} #{shown+1}:', snippet)
                  pos=i+len(n); shown+=1

          print('=== COMMITS TOUCHING assets/stickers ===')
          log = sh('git','log','--all','--format=%H%x09%ad%x09%s','--date=iso','--','assets/stickers')
          print(log or '(none)')
          commits=[ln.split('\t',1)[0] for ln in log.splitlines() if ln.strip()]
          print('=== ASSET CHANGE DETAILS ===')
          for c in commits[:30]:
              parents = sh('git','show','-s','--format=%P',c).split()
              parent=parents[0] if parents else None
              def count_at(ref):
                  try:
                      out=sh('git','ls-tree','-r','--name-only',ref,'--','assets/stickers')
                      return len([x for x in out.splitlines() if x.strip()])
                  except Exception: return -1
              print('COMMIT', c, sh('git','show','-s','--format=%ad %s','--date=iso',c))
              print(' count parent/current', count_at(parent) if parent else None, count_at(c))
              if parent:
                  diff=sh('git','diff','--name-status',parent,c,'--','assets/stickers')
                  print(diff[:30000] if diff else '(no file changes)')

          print('=== STICKER-SUBJECT COMMITS ===')
          print(sh('git','log','--all','--format=%H%x09%ad%x09%s','--date=iso','--grep=sticker','-i','-n','80'))
          print('DIAG STICKER RECOVERY DONE')
          PY

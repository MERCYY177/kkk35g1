name: Inspect CSS registry numbering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-css-registry.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace preset introduction commits
        shell: bash
        run: |
          set -e
          echo '=== preset introduction history ==='
          for token in \
            builtin_xiaoshu_jrys_tuwan_pink_kkk35g_v1 \
            builtin_xiaoshu_line_kitty_black_white_kkk35g_v1 \
            builtin_xiaoshu_webchat_pink_yellow_round_template_v1 \
            builtin_pass_01_淡盐气泡_通过版_feb33a \
            builtin_pass_02_古早微信绿色_通过版_1b51ef \
            builtin_pass_03_氧气感粉色_通过版_3f7645 \
            builtin_pass_09_Eve古早微信灰黑_通过版_481d26; do
            echo "TOKEN $token"
            git log --all --date=iso --format='%H %ad %s' -S "$token" -- index.html | head -12 || true
          done
          echo '=== recent index commits ==='
          git log -30 --date=iso --format='%H %ad %s' -- index.html

name: Diagnose sticker init order

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print sticker init call order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          terms=['migrateLegacySync','mergeHidden(','persistHidden(','syncRuntime(','hydrate(','xiaoshuStickerStore=api','xiaoshuGetSharedStickerPool=getPool','builtinSrcs()','repairBuiltinWebHiddenOnce']
          for i,line in enumerate(lines,1):
              if 17635 <= i <= 18145 and any(t in line for t in terms):
                  print(f'{i}: {line[:2400]}')
          PY

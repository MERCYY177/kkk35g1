name: Apply behavior settings

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_behavior_settings.py'
      - '.github/workflows/apply-behavior-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix matcher for current call button id
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_behavior_settings.py')
          s = p.read_text(encoding='utf-8')
          old = "function ensureCallButton(){var right=$('xs-stable-right');if(!right)return null;var b=$('xs-chat-more-button');if(!b){b=document.createElement('button');b.id='xs-chat-more-button';b.type='button';b.setAttribute('aria-label','发起通话');b.setAttribute('title','发起通话');b.innerHTML='<i class=\\\"fas fa-phone\\\"></i>';right.appendChild(b)}return b}"
          new = "function ensureCallButton(){var right=$('xs-stable-right');if(!right)return null;var b=$('xs-chat-call-button');if(!b){b=document.createElement('button');b.id='xs-chat-call-button';b.type='button';b.setAttribute('aria-label','发起通话');b.setAttribute('title','发起通话');b.innerHTML='<i class=\\\"fas fa-phone\\\"></i>';right.appendChild(b)}return b}"
          if old not in s:
              raise SystemExit('matcher source not found in patcher')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('PATCHER_MATCHER_FIXED')
          PY
      - name: Apply patch
        run: python tools/apply_behavior_settings.py
      - name: Run behavior regression test
        run: python tools/test_behavior_settings.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, sys
          text = Path('index.html').read_text(encoding='utf-8')
          tags = re.findall(r'<script\b([^>]*)>(.*?)</script>', text, flags=re.I|re.S)
          checked = 0
          for attrs, body in tags:
              if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              m = re.search(r'\btype\s*=\s*["\']([^"\']+)', attrs, flags=re.I)
              if m and m.group(1).lower() not in ('text/javascript','application/javascript','module'):
                  continue
              if not body.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8', delete=False) as f:
                  f.write(body)
                  name = f.name
              p = subprocess.run(['node','--check',name], text=True, capture_output=True)
              if p.returncode:
                  print(p.stderr)
                  sys.exit(p.returncode)
              checked += 1
          print(f'INLINE_JS_SYNTAX_OK {checked}')
          PY
      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add behavior timing and call controls"
          git push origin HEAD:main

name: Inspect CSS registry numbering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-css-registry.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect CSS registries and more button
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          def meta(o):
              return {k:o.get(k) for k in ('id','name','title','label','key','author') if isinstance(o,dict) and o.get(k) not in (None,'')}
          m=re.search(r'<script id="xiaoshu-builtin-bubble-css-data" type="application/json">(.*?)</script>',s,re.S)
          print('BUBBLE BLOCK',bool(m))
          if m:
              arr=json.loads(m.group(1)); print('BUBBLE COUNT',len(arr))
              for i,o in enumerate(arr,1):
                  css=str(o.get('chatCss','') or '')
                  print('BUBBLE',i,meta(o),'csslen',len(css),'rabbit',any(x in css.lower() for x in ['兔','rabbit','bunny']))
          m2=re.search(r'const BUILTIN_KEYBOARD_BEAUTY_STYLES=(\[.*?\]);',s,re.S)
          print('KEYBOARD BLOCK',bool(m2))
          if m2:
              arr=json.loads(m2.group(1)); print('KEYBOARD COUNT',len(arr))
              for i,o in enumerate(arr,1):
                  css=str(o.get('css','') or '')
                  print('KEYBOARD',i,meta(o),'csslen',len(css),'rabbit',any(x in css.lower() for x in ['兔','rabbit','bunny']))
          print('RABBIT CONTEXTS')
          for pat in ['兔丸','兔','rabbit','bunny']:
              starts=[m.start() for m in re.finditer(re.escape(pat),s,re.I)]
              print(pat,'count',len(starts))
              for p in starts[:10]: print(repr(s[max(0,p-220):p+420]))
          print('MORE BUTTON CONTEXTS')
          for needle in ['xs-chat-more-button','fa-ellipsis-h']:
              ps=[m.start() for m in re.finditer(re.escape(needle),s)]
              print(needle,'count',len(ps))
              for p in ps[:8]: print(repr(s[max(0,p-300):p+500]))
          PY

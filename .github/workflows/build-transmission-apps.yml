name: Build Transmission Android Apps

on:
  push:
    branches: [main]
    paths:
      - "android-apps/**"
      - ".github/workflows/build-transmission-apps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build both APKs
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleStandardDebug :app:assembleDarkfixDebug

      - name: Prepare APK files
        run: |
          mkdir -p release-apks
          cp android-apps/app/build/outputs/apk/standard/debug/app-standard-debug.apk release-apks/传讯.apk
          cp android-apps/app/build/outputs/apk/darkfix/debug/app-darkfix-debug.apk release-apks/传讯-深色修复版.apk
          ls -lh release-apks

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: 传讯-两个APK
          path: release-apks/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: transmission-apps-build-${{ github.run_number }}
          name: 传讯 Android Apps Build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: release-apks/*.apk

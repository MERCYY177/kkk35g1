name: Empty mail regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/empty-mail-regression.yml'
      - 'tools/test_empty_mail_regression.py'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run empty-mail regression test
        run: python tools/test_empty_mail_regression.py

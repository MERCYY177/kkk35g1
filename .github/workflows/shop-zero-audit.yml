name: Zero Shop residual audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Final absolute zero-Shop verification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s=Path('index.html').read_text(encoding='utf-8')

          # Absolute Shop spelling check: no runtime, storage, CSS, comment or compatibility name may remain.
          shop_hits=[(n,line.rstrip()) for n,line in enumerate(s.splitlines(),1) if 'shop' in line.lower()]
          print('shop substring lines:',len(shop_hits))
          for item in shop_hits: print(item)

          legacy=[
            'shareData','productData','orderData','cardData','giftData','couponData','pay-request',
            '好物分享','商品内容','商品卡片','商品卡','商品','购物','购买','代付','帮我买','cardTag',
            'productFromItem','productRow','renderWallet','showCouponWallet','giftsData','ShopDB',
            'xsProductFromShareMessage','xsRenderShopCardFromMessage','xs-shop-card-message',
            'product-card','order-product','wallet','cart','price','¥','￥'
          ]
          legacy_hits={x:s.count(x) for x in legacy if s.count(x)}
          print('legacy commerce hits:',legacy_hits)

          share_type=list(re.finditer(r"\btype\s*={2,3}\s*['\"]share['\"]",s))
          print('retired share-type hits:',len(share_type))
          for m in share_type:
              print('share-type line',s.count('\n',0,m.start())+1)

          required=[
            'xiaoshu-coupon-chat-card','red-packet-card','transfer-bubble','m.redPacket','m.transfer',
            '收藏','朋友圈','相册','相机','电话','短信','callRecordsV2'
          ]
          missing=[x for x in required if x not in s]
          print('required current features missing:',missing)

          if shop_hits: raise SystemExit('Shop spelling remains')
          if legacy_hits: raise SystemExit('legacy commerce semantics remain: '+repr(legacy_hits))
          if share_type: raise SystemExit('retired share message type remains')
          if missing: raise SystemExit('current feature regression: '+repr(missing))
          print('FINAL ABSOLUTE ZERO-SHOP GREEN')
          PY
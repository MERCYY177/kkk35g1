<!doctype html><meta charset="utf-8"><title>Sticker core regression</title>
<script src="../sticker-core.js"></script>
<body data-status="running"><pre id="result">RUNNING</pre></body>
<script>
(function(){
  var passed=0,failures=[];
  function test(name,fn){try{fn();passed++}catch(e){failures.push(name+': '+(e&&e.message||e))}}
  function equal(a,b,m){if(a!==b)throw new Error((m||'values differ')+' actual='+a+' expected='+b)}
  function ok(v,m){if(!v)throw new Error(m||'expected truthy')}
  var core=window.XiaoshuStickerCore;
  test('core exports',function(){ok(core)});
  test('safe nested sticker path and traversal rejection',function(){
    equal(core.safeResourceUrl('assets/stickers/embedded/embedded_001.gif','image'),'assets/stickers/embedded/embedded_001.gif');
    ['assets/stickers/../secret.gif','assets/stickers/embedded\\evil.gif','assets/stickers/embedded/%2e%2e/evil.gif','assets/stickers/a\u0000.gif','javascript:alert(1)'].forEach(function(x){equal(core.safeResourceUrl(x,'image'),'','reject '+x)})
  });
  test('retry URL preserves query and hash',function(){equal(core.withRetryToken('assets/stickers/a.gif?size=large#preview',7),'assets/stickers/a.gif?size=large&__xs_sticker_retry=7#preview')});
  test('first request uses original URL',function(){equal(core.requestUrl('assets/stickers/a.gif',0,false),'assets/stickers/a.gif')});
  test('slow loading does not fail or duplicate',function(){
    var requests=[];var m=core.createLoadMachine({resolve:function(){return'assets/stickers/phone_098.gif'},request:function(url,h){requests.push({url:url,h:h})},schedule:function(fn,ms){return{fn:fn,ms:ms}},cancel:function(){},onState:function(){},timeoutMs:20000});
    m.start('large');equal(m.state(),'loading');equal(requests.length,1);equal(requests[0].url,'assets/stickers/phone_098.gif');m.start('large');equal(requests.length,1);requests[0].h.load();equal(m.state(),'loaded')
  });
  test('missing resource reaches terminal state',function(){
    var tasks=[];var m=core.createLoadMachine({resolve:function(){return''},request:function(){throw Error('unexpected request')},schedule:function(fn,ms){var x={fn:fn,ms:ms};tasks.push(x);return x},cancel:function(){},onState:function(){},maxResolveAttempts:2,resolveDelayMs:10});
    m.start('missing');equal(m.state(),'pending-resource');tasks.shift().fn();tasks.shift().fn();equal(m.state(),'resource-missing')
  });
  test('real error retries with cache bust and recovers',function(){
    var url='',handlers;var m=core.createLoadMachine({resolve:function(){return'assets/stickers/embedded/embedded_001.gif'},request:function(u,h){url=u;handlers=h},schedule:function(fn){return{fn:fn}},cancel:function(){},onState:function(){}});
    m.start('id');handlers.error();equal(m.state(),'load-failed');m.retry();ok(/__xs_sticker_retry=1/.test(url));handlers.load();equal(m.state(),'loaded')
  });
  test('history mapping rebuilds from stable sticker id',function(){var src='assets/stickers/embedded/embedded_001.gif',id=core.stickerId(src),r=core.rebuildResourceMap([{stickerId:id}],{},[src]);equal(r.map[id],src);equal(r.missing.length,0);equal(core.rebuildResourceMap([{stickerId:'stk_unknown'}],{},[src]).missing[0],'stk_unknown')});
  document.body.dataset.status=failures.length?'failed':'passed';document.getElementById('result').textContent=failures.length?'FAIL '+failures.length+'\n'+failures.join('\n'):'PASS '+passed;
})();
</script>

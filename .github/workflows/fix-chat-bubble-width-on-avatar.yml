name: One-time chat bubble width repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chat-bubble-width-on-avatar.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch the shrinking parent width
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          old = "body.xiaoshu-beautified #chat-container .message-wrapper{min-width:0!important;max-width:100%!important;}"
          new = "body.xiaoshu-beautified #chat-container .message-wrapper{width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important;}"

          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected one exact target rule, found {count}; no changes made.")

          source = source.replace(old, new, 1)

          if source.count(new) != 1 or old in source:
              raise SystemExit("Post-patch verification failed.")

          # Keep the existing child max-width rule; it can now calculate against a definite row width.
          child_rule = "body.xiaoshu-beautified #chat-container .message-content-wrapper{min-width:0!important;max-width:calc(100% - 44px)!important;box-sizing:border-box!important;}"
          if child_rule not in source:
              raise SystemExit("Expected child width rule missing; no changes made.")

          path.write_text(source, encoding="utf-8")
          print("PATCH_OK: gave chat message rows a definite available width.")
          print("PRESERVED: child max-width rule and all unrelated source.")
          PY

      - name: Verify, remove temporary workflow, and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          expected = "body.xiaoshu-beautified #chat-container .message-wrapper{width:100%!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important;}"
          assert source.count(expected) == 1, "patched row rule missing/duplicated"
          assert 'width:fit-content' in source or "width:'fit-content'" in source, "uniform bubble sizing code unexpectedly missing"
          print("VERIFY_OK: patch present; existing bubble sizing code retained.")
          PY

          rm .github/workflows/fix-chat-bubble-width-on-avatar.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-chat-bubble-width-on-avatar.yml
          git commit -m 'fix: prevent chat bubbles from collapsing after avatar updates'
          git push

name: Builtin theme remote assets regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/builtin-theme-remote-assets-regression.yml'
      - 'tools/test_builtin_theme_remote_assets.py'
      - 'tools/fix_builtin_theme_remote_assets.py'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run built-in theme remote asset regression
        run: python tools/test_builtin_theme_remote_assets.py

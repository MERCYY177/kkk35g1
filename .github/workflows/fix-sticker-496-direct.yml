name: Diagnose exact hidden remerge point

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact store init contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf-8').splitlines()
          for lo,hi in [(17760,17805),(18135,18170)]:
              print(f'===== {lo}-{hi} =====')
              for i in range(lo,hi+1): print(f'{i}: {lines[i-1][:2600]}')
          PY

name: More menu accessibility regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/more-menu-accessibility-regression.yml'
      - 'tools/test_more_menu_accessibility.py'
      - 'tools/fix_more_menu_accessibility.py'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run more menu accessibility regression
        run: python tools/test_more_menu_accessibility.py

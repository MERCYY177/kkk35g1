name: Diagnose builtin loader bootstrap

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect builtin loader definitions and order
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['xiaoshuEnsureBuiltinStickerPacks','xiaoshuBuiltinStickerPacks','xiaoshu-builtin-sticker-packs-data-v1','function builtinPacks','loadSyncState();','window.xiaoshuStickerStore=api']
          for t in terms:
              print('\n====',t,'====')
              pos=0;n=0
              while True:
                  i=s.find(t,pos)
                  if i<0: break
                  n+=1
                  print('POS',i)
                  print(s[max(0,i-1800):min(len(s),i+4200)])
                  pos=i+len(t)
                  if n>=8: break
              print('COUNT',n)
          PY

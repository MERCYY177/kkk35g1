name: Final size audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-size-audit.yml'
      - 'tools/test_theme_asset_extraction.py'
      - 'tools/extract_theme_assets.py'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract built-in theme assets
        run: python tools/extract_theme_assets.py
      - name: Run extraction regression
        run: python tools/test_theme_asset_extraction.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8'); checked=0
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script>',html,re.I|re.S),1):
              attrs,code=m.group(1),m.group(2)
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)["\']',attrs,re.I)
              if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
              suffix='.mjs' if tm and tm.group(1).lower()=='module' else '.js'
              with tempfile.NamedTemporaryFile('w',suffix=suffix,encoding='utf-8',delete=False) as f:
                  f.write(code); name=f.name
              r=subprocess.run(['node','--check',name],text=True,capture_output=True)
              if r.returncode:
                  print(f'inline script #{i} failed syntax check'); print(r.stderr); raise SystemExit(r.returncode)
              checked+=1
          print(f'inline JavaScript syntax checks passed: {checked}')
          PY
      - name: Report optimized sizes
        run: |
          echo "INDEX_BYTES=$(wc -c < index.html)"
          echo "ASSET_FILES=$(find assets/builtin-theme -type f | wc -l)"
          echo "ASSET_BYTES=$(find assets/builtin-theme -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')"
      - name: Commit production optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/builtin-theme/
          git diff --cached --quiet && { echo "expected production optimization changes"; exit 1; }
          git commit -m "perf: extract built-in theme images from index"
          git push

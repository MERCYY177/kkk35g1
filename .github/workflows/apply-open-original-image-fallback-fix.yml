name: Apply original image fallback fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-open-original-image-fallback-fix.yml'
      - 'tools/fix_open_original_image_fallback.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded fallback fix
        run: python tools/fix_open_original_image_fallback.py
      - name: Run original-image fallback regression
        run: node tools/test_open_original_image_fallback.js
      - name: Check every inline JavaScript block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8'); checked=0
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script>',html,re.I|re.S),1):
              attrs,code=m.group(1),m.group(2)
              if re.search(r'\bsrc\s*=',attrs,re.I): continue
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)["\']',attrs,re.I)
              if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'): continue
              suffix='.mjs' if tm and tm.group(1).lower()=='module' else '.js'
              with tempfile.NamedTemporaryFile('w',suffix=suffix,encoding='utf-8',delete=False) as f:
                  f.write(code); name=f.name
              r=subprocess.run(['node','--check',name],text=True,capture_output=True)
              if r.returncode:
                  print(f'inline script #{i} failed syntax check'); print(r.stderr); raise SystemExit(r.returncode)
              checked+=1
          print(f'INLINE_JS_OK={checked}')
          PY
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "expected production fallback fix"; exit 1; }
          git commit -m "fix: preserve page when original image fallback opens"
          git push

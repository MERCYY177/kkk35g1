name: Diagnose sticker store core

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect canonical store core
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()
          lo,hi=17640,18130
          terms=('builtin','hidden','disabled','getPool','pool','uploads','hydrate','api=','api =','CANONICAL','migrate','refresh','filter(','uniq(','saveHidden','loadHidden')
          for i in range(lo,hi+1):
              line=lines[i-1]
              if any(t.lower() in line.lower() for t in terms):
                  print(f'{i}: {line[:2200]}')
          PY

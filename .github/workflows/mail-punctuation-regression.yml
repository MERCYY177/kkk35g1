name: Mail punctuation regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mail-punctuation-regression.yml'
      - 'tools/test_mail_punctuation.py'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mailbox punctuation regression
        run: python tools/test_mail_punctuation.py

name: Deploy v4.4 width fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v4-4-width-fix.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: RED - verify current v4.3 base
        shell: bash
        run: |
          actual="$(git hash-object index.html)"
          expected="5458008717bd846f889e9b209497b8dee6416252"
          echo "current index blob: $actual"
          test "$actual" = "$expected" || { echo "Refusing to patch: index.html is not the verified v4.3 base."; exit 1; }
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          old="""var THEME_LAYOUT_IDS={
          'builtin_xiaoshu_frame_borderimage_v1':1,
          'builtin_xiaoshu_line_cat_milk_v1':1
          };"""
          if old not in s:
              raise SystemExit('Expected current width-restriction block is missing')
          print('RED confirmed: 20 and 22 still own fixed theme layout')
          PY

      - name: Apply width fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""var THEME_LAYOUT_IDS={
          'builtin_xiaoshu_frame_borderimage_v1':1,
          'builtin_xiaoshu_line_cat_milk_v1':1
          };"""
          new="""var THEME_LAYOUT_IDS={
          };"""
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly one layout-id block, found {n}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('Removed fixed-layout ownership for themes 20 and 22')
          PY

      - name: GREEN - verify exact v4.4 target
        shell: bash
        run: |
          actual="$(git hash-object index.html)"
          expected="abcf914cbd49247d2a58dfcfc0b3822ccdb9bd99"
          echo "patched index blob: $actual"
          test "$actual" = "$expected" || { echo "Patched file does not match verified v4.4 target."; exit 1; }
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'var THEME_LAYOUT_IDS=\{(.*?)\};',s,re.S)
          if not m: raise SystemExit('THEME_LAYOUT_IDS missing')
          body=m.group(1).strip()
          assert body=='', repr(body)
          assert 'builtin_xiaoshu_frame_borderimage_v1' in s
          assert 'builtin_xiaoshu_line_cat_milk_v1' in s
          print('GREEN confirmed: themes remain installed, fixed layout ownership removed')
          PY

      - name: Commit v4.4 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No change to commit"; exit 1; }
          git commit -m "更新v4.4：解除20和22气泡宽度限制"
          git push origin HEAD:main

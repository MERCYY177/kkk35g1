name: Zero Shop residual audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce final zero-Shop state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          s=Path('index.html').read_text(encoding='utf-8')

          forbidden=[
            # Retired Shop module / storage / migration.
            'ShopDB','shopDB','openShopDb','readShopStrict','writeShopStrict','clearShopStrict','openShopV99',
            'shopReadMap','shopReplaceMap','captureShop','captureShopCore','normalizeShopData','normalizeRescueShopRaw',
            'shopExpected','shopRestored','shop_gift_cabinet','shop_balance','shop_partner_balance','shop_search_history',
            'shop_products','shop_cart','shop_orders','shop_category','xiaoshu_shop_','xiaoshu_coupon_wallet_v1',
            'coupon_wallet','gift_cabinet','xiaoshu-retired-commerce-cleanup','礼物柜','卡包','商城','.shop-modal',
            # Retired product-card compatibility / TA-phone commerce shell.
            'productFromItem','productRow','xs-product-','renderWallet','showCouponWallet','giftsData',
            'xsShopCardEsc','xsHasRealShopCardHtml','xsProductFromShareMessage','xsShopCardTagFromMessage',
            'xsRenderShopCardFromMessage','isShopCardMessage','safeShopHtml','data-shop-card','xs-shop-share-card',
            'shop-chat-card','ta-phone-product-card','order-product','xs-shop-card-message',"kind === 'shop'","return 'shop'",
            'xiaoshu-ta-phone-collections-and-gifts-v1-js','__xiaoshuTaPhoneCollectionsAndGiftsV1',
            'xs-gift-time-line','xiaoshu-exit-button-and-coupon-wallet-style',
            # Final retired message-data compatibility layer.
            'shareData','productData','orderData','cardData','giftData','couponData','pay-request',
            '好物分享','商品内容','商品卡片','商品卡','商品','帮我买','cardTag'
          ]
          bad={x:s.count(x) for x in forbidden if s.count(x)}
          print('=== forbidden Shop / legacy-commerce residuals ===')
          print(bad)

          required=[
            # Current non-Shop card features.
            'xiaoshu-coupon-chat-card','red-packet-card','transfer-bubble','m.redPacket','m.transfer',
            # Current TA-phone/system features that must not regress.
            '收藏','朋友圈','相册','相机','电话','短信','callRecordsV2'
          ]
          missing=[x for x in required if x not in s]
          print('=== required current features missing ===')
          print(missing)

          # Diagnostics for semantic leftovers which are intentionally not blanket-failed by generic words.
          semantic_patterns={
            "type === share": r"(?:message|msg|copy|m)?\.?type\s*===\s*['\"]share['\"]",
            "type == share": r"(?:message|msg|copy|m)?\.?type\s*==\s*['\"]share['\"]",
            "type share literal": r"\btype\s*:\s*['\"]share['\"]",
            "shop word": r"\bshop\b",
            "product word": r"\bproduct\b",
            "wallet word": r"\bwallet\b",
            "cart word": r"\bcart\b",
            "gift word": r"\bgift\b",
            "price identifier": r"\bprice\b",
            "currency yuan": r"[¥￥]",
            "purchase Chinese": r"购买|购物|代付|好物"
          }
          print('=== semantic diagnostics ===')
          for label,pat in semantic_patterns.items():
              hits=list(re.finditer(pat,s,re.I))
              print(label, len(hits))
              for m in hits[:20]:
                  line=s.count('\n',0,m.start())+1
                  a=s.rfind('\n',0,m.start())+1
                  b=s.find('\n',m.end())
                  if b<0: b=len(s)
                  text=s[a:b].strip()
                  if len(text)>1800: text=text[:1800]+' …'
                  print(f'  L{line}: {text}')

          if bad:
              raise SystemExit('FINAL zero-Shop audit RED: '+repr(bad))
          if missing:
              raise SystemExit('current feature regression: '+repr(missing))
          print('FINAL strict zero-Shop audit GREEN')
          PY
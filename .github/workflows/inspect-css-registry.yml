name: Inspect CSS registry numbering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-css-registry.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect appended CSS presets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          needle='XIAOSHU_PHASE1_BUILTINS'
          ps=[m.start() for m in re.finditer(needle,s)]
          print('count',len(ps))
          for p in ps:
              print('\n--- context ---')
              print(s[max(0,p-1000):p+8000])
          PY

name: Apply verified chat stability fix

on:
  push:
    branches: [repair-chat-20260920]
    paths:
      - '.github/workflows/apply-chat-stability-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Chat1 and Chat2 sticker data flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global s
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: expected exactly 1 target, found {n}')
              s=s.replace(old,new,1)
              print('patched:',label)

          # Parent -> Chat2: if the primary store exists but is temporarily empty,
          # keep falling back instead of sending an empty array to Chat2.
          old_parent="""function bigKeyboardStickerPool(){
          var pool=[];
          try{
          if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool();
          else if(typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool();
          else if(Array.isArray(window._stickerLibrary))pool=window._stickerLibrary;
          }catch(e){pool=[];}
          var seen=new Set();
          return (Array.isArray(pool)?pool:[]).map(function(x){return String(x||'').trim();}).filter(function(x){if(!x||seen.has(x))return false;seen.add(x);return true;});
          }"""
          new_parent="""function bigKeyboardStickerPool(){
          var pool=[];
          try{
          if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool()||[];
          if((!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool()||[];
          if((!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary))pool=window._stickerLibrary;
          }catch(e){pool=[];}
          var seen=new Set();
          return (Array.isArray(pool)?pool:[]).map(function(x){return String(x||'').trim();}).filter(function(x){if(!x||seen.has(x))return false;seen.add(x);return true;});
          }"""
          replace_once(old_parent,new_parent,'parent Chat2 sticker pool fallback')

          # Chat2: before showing “暂无”, read the same shared pool directly from
          # the parent as a same-origin fallback, then request state again if still empty.
          old_empty="""if(!sharedStickerPool.length){if(!grid.firstChild){const empty=document.createElement('div');empty.className='kb-sticker-empty';empty.textContent='暂无';grid.appendChild(empty);}return;}"""
          new_empty="""if(!sharedStickerPool.length){
          try{
          if(window.parent&&window.parent!==window){
          let parentPool=[];
          if(window.parent.xiaoshuStickerStore&&typeof window.parent.xiaoshuStickerStore.getPool==='function')parentPool=window.parent.xiaoshuStickerStore.getPool()||[];
          if((!Array.isArray(parentPool)||!parentPool.length)&&typeof window.parent.xiaoshuGetSharedStickerPool==='function')parentPool=window.parent.xiaoshuGetSharedStickerPool()||[];
          if((!Array.isArray(parentPool)||!parentPool.length)&&Array.isArray(window.parent._stickerLibrary))parentPool=window.parent._stickerLibrary;
          sharedStickerPool=normalizeSharedStickerPool(parentPool);
          }
          }catch(_e){}
          }
          if(!sharedStickerPool.length){requestSharedStickerPool();if(!grid.firstChild){const empty=document.createElement('div');empty.className='kb-sticker-empty';empty.textContent='暂无';grid.appendChild(empty);}return;}"""
          replace_once(old_empty,new_empty,'Chat2 empty-pool self-heal')

          # Chat1: keep the fast first batch, then fill the remaining DOM in idle chunks.
          # This removes the requirement to hit the exact scroll threshold while avoiding
          # the previous all-496-at-once jank.
          append_pat=re.compile(r"(  function appendStickerBatch\(\)\{.*?grid\.appendChild\(frag\);pending\.forEach\(function\(img\)\{queueStickerThumb\(img,img\.__stickerSrc,false\);\}\);\n  \})",re.S)
          matches=list(append_pat.finditer(s))
          if len(matches)!=1:
              raise SystemExit(f'Chat1 appendStickerBatch: expected 1 target, found {len(matches)}')
          helper="""
          function scheduleStickerGridFill(generation){
            if(generation!==stickerLoadGeneration)return;
            var grid=document.querySelector('#combo-content-area .xs-final-sticker-grid');
            if(!grid||!grid.isConnected||stickerRenderedCount>=stickerPool.length)return;
            appendStickerBatch();
            if(generation!==stickerLoadGeneration||stickerRenderedCount>=stickerPool.length)return;
            var next=function(){scheduleStickerGridFill(generation);};
            if(typeof window.requestIdleCallback==='function')window.requestIdleCallback(next,{timeout:120});else setTimeout(next,16);
          }"""
          s=append_pat.sub(lambda m:m.group(1)+helper,s,count=1)
          print('patched: Chat1 progressive background fill')

          replace_once(
              "if(grid){appendStickerBatch();bindStickerGrid(grid,a);}",
              "if(grid){appendStickerBatch();bindStickerGrid(grid,a);scheduleStickerGridFill(stickerLoadGeneration);}",
              'Chat1 progressive fill activation'
          )

          # Automatic partner sticker sending: use the same non-empty fallback chain.
          old_auto="""try{if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool()||[];else if(typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool()||[]}catch(e){pool=[]}"""
          new_auto="""try{if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')pool=window.xiaoshuStickerStore.getPool()||[];if((!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function')pool=window.xiaoshuGetSharedStickerPool()||[];if((!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary))pool=window._stickerLibrary}catch(e){pool=[]}"""
          replace_once(old_auto,new_auto,'automatic sticker sender empty-pool fallback')

          # Chat1 pool getter has the same potential initialization race in some builds.
          old_chat1="""if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')out=window.xiaoshuStickerStore.getPool();else if(typeof window.xiaoshuGetSharedStickerPool==='function')out=window.xiaoshuGetSharedStickerPool();else if(Array.isArray(window._stickerLibrary))out=window._stickerLibrary;"""
          new_chat1="""if(window.xiaoshuStickerStore&&typeof window.xiaoshuStickerStore.getPool==='function')out=window.xiaoshuStickerStore.getPool()||[];if((!Array.isArray(out)||!out.length)&&typeof window.xiaoshuGetSharedStickerPool==='function')out=window.xiaoshuGetSharedStickerPool()||[];if((!Array.isArray(out)||!out.length)&&Array.isArray(window._stickerLibrary))out=window._stickerLibrary;"""
          n=s.count(old_chat1)
          if n==1:
              s=s.replace(old_chat1,new_chat1,1)
              print('patched: Chat1 getter empty-pool fallback')
          elif n==0:
              print('Chat1 getter exact legacy chain not present; no patch needed')
          else:
              raise SystemExit(f'Chat1 getter: ambiguous target count {n}')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify full requirement checklist
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,subprocess

          s=Path('index.html').read_text(encoding='utf-8')
          failures=[]
          def ok(cond,msg):
              print(('PASS ' if cond else 'FAIL ')+msg)
              if not cond: failures.append(msg)

          # Canonical 496 must remain exactly the historical wanted corpus.
          pat=r'<script[^>]+id=["\']xiaoshu-builtin-sticker-packs-data-v1["\'][^>]*>(.*?)</script>'
          m=re.search(pat,s,re.S|re.I)
          cur=[]
          if m:
              data=json.loads(m.group(1))
              cur=[str(i.get('src','')).strip() for p in data for i in (p.get('items') or []) if isinstance(i,dict) and str(i.get('src','')).strip()]
          old=subprocess.check_output(['git','show','bd884979aec7822e1fd307b3fc1a593942f2082d:index.html'],text=True,encoding='utf-8',errors='replace')
          hm=re.search(pat,old,re.S|re.I)
          hist=[]
          if hm:
              hd=json.loads(hm.group(1))
              hist=[str(i.get('src','')).strip() for p in hd for i in (p.get('items') or []) if isinstance(i,dict) and str(i.get('src','')).strip()]
          ok(len(cur)==496 and len(set(cur))==496,'canonical sticker corpus is 496 unique')
          ok(cur==hist,'canonical 496 exactly matches historical wanted corpus')
          assets=list(Path('assets/stickers').glob('*'))
          assets=[x for x in assets if x.is_file() and x.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp'}]
          ok(len(assets)==615,'physical sticker assets remain 615')
          ok(len({x.name for x in assets}-{Path(x).name for x in cur})==119,'119 unwanted physical stickers remain excluded')

          # Chat1: first batch remains fast, background chunks guarantee the full pool is eventually represented.
          ok('function scheduleStickerGridFill(generation)' in s,'Chat1 progressive fill helper exists')
          ok('scheduleStickerGridFill(stickerLoadGeneration)' in s,'Chat1 starts progressive completion after first batch')
          ok('if(grid){appendStickerBatch();bindStickerGrid(grid,a);}' not in s,'Chat1 no longer depends only on manual scroll for additional batches')
          ok('while(stickerRenderedCount<stickerPool.length)appendStickerBatch();' not in s,'Chat1 does not synchronously inject all 496 at once')

          # Chat2 bridge: empty primary store must fall through, iframe must self-heal before showing empty.
          parent=re.search(r'function bigKeyboardStickerPool\(\)\{.*?\n\}',s,re.S)
          parent_text=parent.group(0) if parent else ''
          ok("(!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function'" in parent_text,'parent bridge falls back when primary pool is empty')
          ok("(!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary)" in parent_text,'parent bridge reaches canonical library fallback')
          ok('window.parent.xiaoshuStickerStore' in s and 'sharedStickerPool=normalizeSharedStickerPool(parentPool);' in s,'Chat2 directly recovers pool from parent when message state is empty')
          ok("if(!sharedStickerPool.length){requestSharedStickerPool();" in s,'Chat2 re-requests sticker state before leaving empty state')
          ok('while(sharedStickerRenderedCount<sharedStickerPool.length)appendSharedStickerBatch();' in s,'Chat2 renders every received shared sticker')
          ok("raw.startsWith('assets/stickers/')||raw.startsWith('./assets/stickers/')" in s,'Chat2 accepts bundled relative sticker assets')

          # Automatic sticker sender uses the same robust fallback chain.
          auto=re.search(r'window\.xiaoshuSendPartnerStickerNow=function\(\).*?function mount\(\)',s,re.S)
          auto_text=auto.group(0) if auto else ''
          ok("(!Array.isArray(pool)||!pool.length)&&typeof window.xiaoshuGetSharedStickerPool==='function'" in auto_text,'automatic sticker sender falls back from an empty primary store')
          ok("(!Array.isArray(pool)||!pool.length)&&Array.isArray(window._stickerLibrary)" in auto_text,'automatic sticker sender can use canonical sticker library')

          # Existing requested fixes must not regress.
          bm=re.search(r'<script id="xiaoshu-builtin-bubble-css-data" type="application/json">(.*?)</script>',s,re.S)
          km=re.search(r'const BUILTIN_KEYBOARD_BEAUTY_STYLES=(\[.*?\]);\s*let editingKeyboardBeautyId',s,re.S)
          chat1=json.loads(bm.group(1)) if bm else []
          chat2=json.loads(km.group(1)) if km else []
          ok(len(chat1)==18 and len(chat2)==18,'Chat1 and Chat2 each retain 18 beauty themes')
          ok([x.get('name') for x in chat1]==[x.get('name') for x in chat2],'Chat1 and Chat2 beauty theme catalogs stay synchronized')
          ok(s.count("writeEventOnce(call,'fa-phone-slash','我已拒绝','')")==1,'incoming reject text is 我已拒绝')
          ok(s.count('.call-event-message{display:flex!important;align-items:center!important;justify-content:center!important;')==1,'call event row remains centered')

          # Basic structural sanity.
          ok(s.count('<html')>=1 and s.count('</html>')>=1,'document keeps HTML root')
          ok(len(s)>1500000,'index.html was not accidentally truncated')

          if failures:
              raise SystemExit('verification failed: '+', '.join(failures))
          print(f'ALL CHECKS PASSED ({18} checks)')
          PY

      - name: Commit repair branch change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: stabilize shared stickers across both chats'
          git push origin HEAD:repair-chat-20260920

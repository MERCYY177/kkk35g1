name: Restore Chat1 fixed reply count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chat1-reply-count.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the tested reply-count patch
        shell: bash
        env:
          REPLY_COUNT_PATCH_B64: 
        run: |
          printf '%s' "$REPLY_COUNT_PATCH_B64" | base64 -d > /tmp/reply-count.patch
          git apply --check /tmp/reply-count.patch
          git apply /tmp/reply-count.patch

      - name: Verify reply-count behavior and page scripts
        shell: bash
        run: |
          node tests/chat1-reply-count.test.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const html=fs.readFileSync('index.html','utf8');
          const re=/<script([^>]*)>([\\s\\S]*?)<\\/script>/gi;
          let m,total=0,checked=0,failed=0;
          while((m=re.exec(html))){
            total++;
            const attrs=m[1]||'';
            if(/\\bsrc\\s*=/.test(attrs)||/type\\s*=\\s*["'](?:application\\/json|text\\/plain)["']/i.test(attrs))continue;
            checked++;
            try{new vm.Script(m[2],{filename:`inline-script-${total}.js`});}
            catch(e){failed++;console.error(`inline-script-${total}: ${e.message}`);}
          }
          console.log(JSON.stringify({total,checked,failed}));
          if(failed)process.exit(1);
          NODE
          git diff --check

      - name: Commit the verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/chat1-reply-count.test.cjs
          git commit -m 'fix: restore configurable Chat1 reply count'
          git push


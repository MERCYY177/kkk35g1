name: Phase 1 backup repair validation

on:
  push:
    branches:
      - repair/phase1-backup-font-rescue-20261101
    paths:
      - ".github/workflows/phase1-validation.yml"
      - "index.html"
      - "custom-font-manager.js"
      - "font-integrity.js"
      - "font-backup-codec.js"
      - "tests/**"
      - "android-apps/**"

permissions:
  contents: read

concurrency:
  group: phase1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout phase 1 repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check embedded JavaScript syntax
        run: python3 tests/check_html_scripts.py

      - name: Install isolated IndexedDB test adapter
        run: npm install --no-save --ignore-scripts --no-audit --no-fund fake-indexeddb@6.2.4 jszip@3.10.1 playwright@1.56.1

      - name: Run V99 emergency rescue test independently
        run: node --test tests/v99-emergency-rescue.test.js

      - name: Run all Node regression tests
        run: node --test tests/*.test.js

      - name: Install Chromium for real browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Run real Chromium sticker deletion end-to-end test
        run: node --test tests/browser-e2e/sticker-deletion.playwright.test.mjs

      - name: Audit Android packaging and font integration
        run: python3 tests/audit_local_android_project.py

      - name: Run Android native save bridge unit tests
        working-directory: android-apps
        run: gradle --no-daemon :app:testChuanxun1DebugUnitTest

      - name: Upload Android JUnit XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-save-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-apps/app/build/test-results/testChuanxun1DebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build all three Android debug APKs for device acceptance
        working-directory: android-apps
        run: gradle --no-daemon :app:assembleChuanxun1Debug :app:assembleChuanxun2Debug :app:assembleChuanxun3Debug

      - name: Upload Android debug APKs for manual device acceptance
        uses: actions/upload-artifact@v4
        with:
          name: android-device-acceptance-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-apps/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Report validation scope
        if: always()
        run: |
          echo "This workflow validates source and builds debug APKs for manual device acceptance."
          echo "It does not build or deploy a web release."
          echo "It does not install APKs on a physical Android device."
          echo "It does not access or modify a user's browser databases."
          echo "Android device file-picker behavior still requires device verification."

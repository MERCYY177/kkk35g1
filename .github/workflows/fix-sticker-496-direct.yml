name: Diagnose sticker runtime chain

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trace current sticker data and render chain
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('index.html').read_text(encoding='utf-8')

          pat=r'<script[^>]+id=["\']xiaoshu-builtin-sticker-packs-data-v1["\'][^>]*>(.*?)</script>'
          m=re.search(pat,s,re.S|re.I)
          if not m:
              raise SystemExit('builtin sticker data missing')
          data=json.loads(m.group(1))
          refs=[str(i.get('src','')).strip() for p in data for i in (p.get('items') or []) if isinstance(i,dict) and str(i.get('src','')).strip()]
          print('BUILTIN_REFS_TOTAL',len(refs),'UNIQUE',len(set(refs)))

          keys=['stickerPool','stickerRenderedCount','STICKER_BATCH_SIZE','stickerBatchSize','appendStickerBatch','bindStickerGrid','scheduleStickerGridFill','xiaoshuStickerStore','xiaoshuGetSharedStickerPool','normalizeSticker','getPool','merge','slice(','splice(','filter(','Set(']
          lines=s.splitlines()
          for idx,line in enumerate(lines,1):
              if any(k in line for k in keys):
                  lo=max(1,idx-2); hi=min(len(lines),idx+3)
                  print(f'\n--- L{lo}-L{hi} hit L{idx} ---')
                  for j in range(lo,hi+1):
                      print(f'{j}: {lines[j-1][:1200]}')

          # Extract compact function bodies by brace matching for the important functions.
          def show_func(name):
              mm=re.search(r'(?:function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{|(?:const|let|var)\s+'+re.escape(name)+r'\s*=\s*(?:async\s*)?\([^)]*\)\s*=>\s*\{)',s)
              if not mm:
                  print('\nFUNC_NOT_FOUND',name); return
              start=mm.start(); brace=s.find('{',mm.start(),mm.end()+2)
              depth=0; end=None
              for k in range(brace,len(s)):
                  c=s[k]
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:
                          end=k+1; break
              body=s[start:end or min(len(s),start+5000)]
              print('\n=== FUNCTION',name,'===\n',body[:12000])
          for name in ['appendStickerBatch','bindStickerGrid','scheduleStickerGridFill','activateStickerTab','loadStickerPool','getStickerPool','bigKeyboardStickerPool','renderSharedStickerGrid']:
              show_func(name)
          PY

name: Diagnose actual sticker source

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual shared pool and hidden-item logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['getSharedStickers','disabledStickerItems','myStickerLibrary','xiaoshuStickerStore','getBuiltinStickerPacks','builtinSticker','normalizeBuiltin','stickerPool=getSharedStickers','STICKER_BATCH_SIZE']
          for term in terms:
              print('\n==========',term,'==========')
              pos=0;n=0
              while True:
                  i=s.find(term,pos)
                  if i<0: break
                  n+=1
                  lo=max(0,i-2200); hi=min(len(s),i+5000)
                  print('\n--- HIT',n,'AT',i,'---\n'+s[lo:hi])
                  pos=i+len(term)
                  if n>=12: break
              print('TOTAL_SHOWN',n)
          PY

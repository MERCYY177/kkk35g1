name: Mail topic regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mail-topic-regression.yml'
      - 'tools/test_mail_topic_matching.py'
      - 'tools/fix_mail_topic_matching.py'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mailbox topic matching fix
        run: python tools/fix_mail_topic_matching.py
      - name: Run mailbox topic matching regression
        run: python tools/test_mail_topic_matching.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html = Path('index.html').read_text(encoding='utf-8')
          checked = 0
          for i, m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script>', html, re.I | re.S), 1):
              attrs, code = m.group(1), m.group(2)
              if re.search(r'\bsrc\s*=', attrs, re.I):
                  continue
              tm = re.search(r'\btype\s*=\s*["\']([^"\']+)["\']', attrs, re.I)
              if tm and tm.group(1).lower() not in ('text/javascript', 'application/javascript', 'module'):
                  continue
              suffix = '.mjs' if tm and tm.group(1).lower() == 'module' else '.js'
              with tempfile.NamedTemporaryFile('w', suffix=suffix, encoding='utf-8', delete=False) as f:
                  f.write(code)
                  name = f.name
              r = subprocess.run(['node', '--check', name], text=True, capture_output=True)
              if r.returncode:
                  print(f'inline script #{i} failed syntax check')
                  print(r.stderr)
                  raise SystemExit(r.returncode)
              checked += 1
          print(f'inline JavaScript syntax checks passed: {checked}')
          PY
      - name: Commit production fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "expected index.html to change"; exit 1; }
          git commit -m "fix: match mailbox topics by phrases"
          git push

name: Diagnose drawer and beautify ordering

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-drawer-beautify.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect drawer and beautify registries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          out=[]
          out.append('=== DRAWER MATCHES ===')
          pats=re.compile(r'xiaoshuAppDrawer|xiaoshuDrawerMask|(?:open|show|toggle|render|build|refresh)[A-Za-z0-9_]*Drawer|Drawer[A-Za-z0-9_]*(?:open|show|toggle|render|build|refresh)|drawer',re.I)
          hits=[]
          for i,line in enumerate(lines,1):
              if pats.search(line): hits.append(i)
          out.append(f'drawer_hit_lines={hits[:200]} total={len(hits)}')
          # Merge nearby hits into windows, cap output.
          windows=[]
          for n in hits:
              a=max(1,n-10); b=min(len(lines),n+16)
              if windows and a<=windows[-1][1]+2:
                  windows[-1]=(windows[-1][0],max(windows[-1][1],b))
              else: windows.append((a,b))
          for wi,(a,b) in enumerate(windows[:20],1):
              out.append(f'--- DRAWER WINDOW {wi} L{a}-L{b} ---')
              for n in range(a,b+1): out.append(f'{n}: {lines[n-1]}')

          out.append('\n=== BEAUTIFY THEME OCCURRENCES ===')
          theme_re=re.compile(r'(?:^|["\'`])((?:\d{1,2}[_\. -][^"\'`\\\n]{1,80})|(?:JRYS[^"\'`\\\n]{1,80})|(?:LineKitty[^"\'`\\\n]{1,80}))')
          found=[]
          for i,line in enumerate(lines,1):
              if any(k in line for k in ('聊天1内置气泡框样式库','JRYS','LineKitty','eve_','miu','Miu_','微信夜间','古早微信','WhatsApp','叶_')):
                  found.append(i)
          # output compact around first chunks that look like registries
          seen=[]
          for n in found:
              if seen and n-seen[-1] < 5: continue
              seen.append(n)
          out.append(f'theme_related_lines_sample={seen[:120]} total_raw={len(found)}')
          for wi,n in enumerate(seen[:30],1):
              a=max(1,n-3); b=min(len(lines),n+7)
              out.append(f'--- THEME WINDOW {wi} L{a}-L{b} ---')
              for x in range(a,b+1): out.append(f'{x}: {lines[x-1]}')

          out.append('\n=== KNOWN THEME NAME TOKENS / COUNTS ===')
          known=['JRYS兔丸粉白奶黄','LineKitty黑边白气泡','29_网页聊天版粉黄圆角_换色模板','26_古早微信绿色_通过版','24_微信夜间','23_miu仿iOS6蓝灰渐变','22_叶_简化稳定叶子气泡','20_miu简讯蓝','19_miu简讯粉','18_仿WhatsApp灰白上角尾巴','17_miu_仿黑X私信黑版','16_miu_仿黑X私信蓝版','11_miu_米菲记事簿粉版','09_eve_iMessage透明黑版','06_eve_iMessage短信绿版','05_eve_iMessage蓝版','04_eve_一起听灰粉版_v2','03_eve_一起听黑灰版_v2']
          for k in known: out.append(f'{k}: {s.count(k)}')

          # Locate code that applies/stores beautify selection.
          out.append('\n=== BEAUTIFY LOGIC WINDOWS ===')
          logic_hits=[]
          for i,line in enumerate(lines,1):
              low=line.lower()
              if ('beaut' in low or '美化' in line or 'customcss' in low or 'chat1' in low) and any(w in low for w in ('apply','active','builtin','render','save','load','theme','css')):
                  logic_hits.append(i)
          for wi,n in enumerate(logic_hits[:30],1):
              a=max(1,n-3); b=min(len(lines),n+8)
              out.append(f'--- BEAUTIFY LOGIC {wi} L{a}-L{b} ---')
              for x in range(a,b+1): out.append(f'{x}: {lines[x-1]}')

          Path('_diag_drawer_beautify.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _diag_drawer_beautify.txt
          git commit -m 'test: record drawer and beautify diagnostics'
          git push

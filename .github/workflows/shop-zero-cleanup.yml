name: Final zero-Shop cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shop-zero-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final Shop backup semantics and share type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          s=path.read_text(encoding='utf-8')
          before=s

          replacements=[
            ("var cats=categoryIdsPresent(lf,ls,shop);", "var cats=categoryIdsPresent(lf,ls);"),
            ("mediaCount:mediaCount,shopStores:Object.keys(shop).length,ignored:stats.ignored", "mediaCount:mediaCount,ignored:stats.ignored"),
            ("if (text && (type === 'normal' || type === 'share')) {", "if (text && type === 'normal') {"),
            ("if (backupCategory === 'shop' || backupCategory === 'map') return false;", "if (backupCategory === 'map') return false;"),
            ("'CHAT_APP_', 'ta_phone_', 'xiaoshu_', 'moments_', 'shop_', 'dg_',", "'CHAT_APP_', 'ta_phone_', 'xiaoshu_', 'moments_', 'dg_',"),
            (",shopTimeout:12000", ""),
            ("|moments_|shop_|ta_phone_", "|moments_|ta_phone_"),
            ("delete payload.manifest.shopStores;", ""),
            ("live Shop/HomeDoor/sticker/beautify overlays", "live HomeDoor/sticker/beautify overlays")
          ]

          for old,new in replacements:
              count=s.count(old)
              assert count==1, f'expected exactly one final Shop semantic fragment, got {count}: {old!r}'
              s=s.replace(old,new,1)

          # The project has never used Shop. After this pass, the source must contain no Shop spelling at all.
          shop_hits=[]
          for lineno,line in enumerate(s.splitlines(),1):
              if 'shop' in line.lower(): shop_hits.append((lineno,line.rstrip()))
          if shop_hits:
              print('remaining Shop substrings:')
              for item in shop_hits: print(item)
              raise SystemExit(f'Shop substring count remains {len(shop_hits)}')

          share_type_hits=list(re.finditer(r"\btype\s*={2,3}\s*['\"]share['\"]",s))
          if share_type_hits:
              for m in share_type_hits:
                  line=s.count('\n',0,m.start())+1
                  print('share-type residue L'+str(line))
              raise SystemExit('retired share message type remains')

          legacy=[
            'shareData','productData','orderData','cardData','giftData','couponData','pay-request',
            '好物分享','商品内容','商品卡片','商品卡','商品','帮我买','cardTag',
            'renderWallet','showCouponWallet','giftsData','productFromItem','productRow','ShopDB'
          ]
          remain={x:s.count(x) for x in legacy if s.count(x)}
          if remain: raise SystemExit('legacy commerce residue reappeared: '+repr(remain))

          required=[
            'xiaoshu-coupon-chat-card','red-packet-card','transfer-bubble',
            '收藏','朋友圈','相册','相机','电话','短信','callRecordsV2',
            'm.redPacket','m.transfer'
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('current feature regression: '+repr(missing))

          if s==before: raise SystemExit('final Shop semantic cleanup made no changes')
          path.write_text(s,encoding='utf-8')
          print('final Shop semantic cleanup complete')
          print('bytes:',len(before.encode('utf-8')),'->',len(s.encode('utf-8')))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: remove final Shop backup semantics"
          git push origin HEAD:main

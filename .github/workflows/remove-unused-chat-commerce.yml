name: Remove unused chat commerce features

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-unused-chat-commerce.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove relationship coupon, red packet and transfer remnants
        run: python tools/remove_unused_chat_commerce.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          forbidden=['transferData','redPacket','red-packet','red-packet-card','transfer-bubble','xiaoshu-coupon-chat-card','relation-coupon','renderRedPacketMessage','showRedPacketReceiveModal','trySystemRedPacket','tryCollectPendingRedPacket','checkRedPacketExpiry','红包','转账','xsGetChatCardKind','xsWhitelistedChatCardKind','xsSanitizeWhitelistedCardHtml','xiaoshu-card-message-outer','card-message-wrapper']
          bad={x:s.count(x) for x in forbidden if s.count(x)}
          required=['voice-message-bubble','message-image','message-video','xs-quote-box','收藏','朋友圈','相册','相机','电话','短信','callRecordsV2','xiaoshu-exit-button-style']
          missing=[x for x in required if x not in s]
          print('forbidden:',bad)
          print('missing:',missing)
          if bad: raise SystemExit('unused chat commerce residue remains: '+repr(bad))
          if missing: raise SystemExit('current feature regression: '+repr(missing))
          print('cleanup validation GREEN')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: remove unused coupon red-packet transfer features"
          git push origin HEAD:main

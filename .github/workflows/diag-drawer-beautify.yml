name: Diagnose current chat defects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-drawer-beautify.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate pool and call ownership logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          def extract_at(start):
              m=re.search(r'function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{',s[start:])
              if not m:return None
              st=start+m.start(); brace=s.find('{',st+m.group(0).find('{'))
              depth=0;quote=None;esc=False;i=brace
              while i<len(s):
                  c=s[i]
                  if quote:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==quote:quote=None
                  else:
                      if c in "'\"`":quote=c
                      elif c=='{':depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:return m.group(1),s[st:i+1]
                  i+=1
              return m.group(1),s[st:st+8000]
          def func(name,occ=0):
              ms=list(re.finditer(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',s))
              out.append(f'\n=== {name} occ={occ} matches={len(ms)} ===')
              if len(ms)<=occ:return
              st=ms[occ].start(); r=extract_at(st)
              out.append(r[1] if r else 'extract failed')
          for n in ['buildPool','builtinSrcs','publishLegacyPool','emit','withoutBuiltins','isImage','norm','getPool','syncRuntime','hydrate']:
              func(n)
          func('safeResourceUrl',0);func('safeResourceUrl',1)
          # function names containing call/phone, plus source around likely reject/status phrases
          names=[]
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]*(?:Call|call|Phone|phone)[A-Za-z0-9_$]*)\s*\(',s):
              n=m.group(1)
              if n not in names:names.append(n)
          out.append('\n=== CALL FUNCTION NAMES ===\n'+repr(names))
          for n in names:
              if re.search(r'(record|status|reject|decline|incoming|end|hang|render|finish|answer|call)',n,re.I):
                  func(n)
          # direct windows around call-specific Chinese words and call-state assignments
          tokens=['未接来电','语音来电','视频来电','已拒绝','拒接','rejected','declined','incoming','outgoing','callRecordsV2','xs-main-call-record-kind']
          for tok in tokens:
              ms=list(re.finditer(re.escape(tok),s,re.I));out.append(f'\n=== TOKEN {tok} count={len(ms)} ===')
              for m in ms[:12]:out.append(s[max(0,m.start()-1000):min(len(s),m.end()+1600)])
          # Chat2 sticker batching/scroll exact functions too.
          for n in ['appendSharedStickerBatch','bindSharedStickerGrid','renderSharedStickerGrid','normalizeSharedStickerPool']:
              func(n)
          text='\n'.join(out)
          Path('_diag_pool_call.txt').write_text(text,encoding='utf-8')
          print('report chars',len(text));print(text[:14000])
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _diag_pool_call.txt
          git commit -m 'test: record pool and call ownership diagnostics'
          git push

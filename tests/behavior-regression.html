<!doctype html>
<meta charset="utf-8">
<title>kkk35g1 behavior regression tests</title>
<script src="../behavior-core.js"></script>
<body data-status="running"><pre id="result">RUNNING</pre></body>
<script>
(function () {
  'use strict';
  var failures = [];
  var passed = 0;
  function test(name, fn) {
    try { fn(); passed += 1; }
    catch (error) { failures.push(name + ': ' + (error && error.message || error)); }
  }
  function equal(actual, expected, message) {
    if (actual !== expected) throw new Error((message || 'values differ') + ' (actual=' + actual + ', expected=' + expected + ')');
  }
  function ok(value, message) { if (!value) throw new Error(message || 'expected truthy value'); }
  function core() {
    ok(window.XiaoshuBehaviorCore, 'XiaoshuBehaviorCore must load');
    return window.XiaoshuBehaviorCore;
  }

  test('fixed count 4 creates four independent payloads', function () {
    var out = core().buildCardReplyPayloads(
      { randomCardComboEnabled: false, fixedCardReplyCount: 4 },
      ['甲', '乙', '丙', '丁', '戊'],
      function () { return 0; }
    );
    equal(out.length, 4);
    equal(new Set(out.map(function (x) { return x.cardFragments[0]; })).size, 4);
    ok(out.every(function (x) { return x.cardFragments.length === 1 && x.text; }));
  });

  test('random combo 2-3 creates one payload with different cards', function () {
    var out = core().buildCardReplyPayloads(
      { randomCardComboEnabled: true, randomCardComboMin: 2, randomCardComboMax: 3 },
      ['你好。', '今天开心！', '晚安'],
      function () { return 0.99; }
    );
    equal(out.length, 1);
    equal(out[0].cardFragments.length, 3);
    equal(new Set(out[0].cardFragments).size, 3);
    ok(out[0].text.indexOf('。。') < 0 && out[0].text.indexOf('！！') < 0);
  });

  test('random combo never falls back to old 75 percent single-card result', function () {
    var api = core();
    [0, 0.2, 0.74, 0.99].forEach(function (value) {
      equal(api.resolveCardReplyCount({ randomCardComboEnabled: true, randomCardComboMin: 2, randomCardComboMax: 3 }, function () { return value; }) >= 2, true);
    });
  });

  test('insufficient cards never creates blank payloads', function () {
    var api = core();
    var one = api.buildCardReplyPayloads({ randomCardComboEnabled: false, fixedCardReplyCount: 4 }, ['', '仅有一张', '  '], function () { return 0; });
    equal(one.length, 1);
    equal(one[0].text, '仅有一张');
    equal(api.buildCardReplyPayloads({ randomCardComboEnabled: true, randomCardComboMin: 2, randomCardComboMax: 3 }, ['', ' '], function () { return 0; }).length, 0);
  });

  test('disabled proactive sticker does not send', function () {
    var sent = 0;
    equal(core().trySendPartnerSticker({ autoStickerEnabled: false, autoStickerChance: 100 }, {
      getPool: function () { return ['sticker']; }, register: function () { return 'id'; }, send: function () { sent += 1; }
    }, function () { return 0; }), false);
    equal(sent, 0);
  });

  test('enabled 100 percent proactive sticker sends exactly once', function () {
    var sent = [];
    equal(core().trySendPartnerSticker({ autoStickerEnabled: true, autoStickerChance: 100 }, {
      getPool: function () { return ['sticker']; }, register: function () { return 'registered'; }, send: function (id) { sent.push(id); }
    }, function () { return 0; }), true);
    equal(sent.length, 1);
    equal(sent[0], 'registered');
  });

  test('empty or unregistrable sticker pool safely skips', function () {
    var api = core(), sent = 0;
    equal(api.trySendPartnerSticker({ autoStickerEnabled: true, autoStickerChance: 100 }, {
      getPool: function () { return []; }, register: function () { return 'id'; }, send: function () { sent += 1; }
    }, function () { return 0; }), false);
    equal(api.trySendPartnerSticker({ autoStickerEnabled: true, autoStickerChance: 100 }, {
      getPool: function () { return ['bad']; }, register: function () { return ''; }, send: function () { sent += 1; }
    }, function () { return 0; }), false);
    equal(sent, 0);
  });

  test('text and sticker proactive schedules are independent', function () {
    var api = core();
    equal(api.getProactiveScheduleFlags({ autoSendEnabled: false, autoStickerEnabled: true }).text, false);
    equal(api.getProactiveScheduleFlags({ autoSendEnabled: false, autoStickerEnabled: true }).sticker, true);
    equal(api.getProactiveScheduleFlags({ autoSendEnabled: true, autoStickerEnabled: false }).text, true);
    equal(api.getProactiveScheduleFlags({ autoSendEnabled: true, autoStickerEnabled: false }).sticker, false);
  });

  test('expired incoming plan is replaced with a future plan', function () {
    var out = core().reconcileIncomingCallPlan({ enabled: true, allowIncoming: true, allowVoiceIncoming: true, allowVideoIncoming: true, nextIncomingAt: 900, plannedSessionId: 'a' }, 'a', 1000, function () { return 600; });
    equal(out.shouldSchedule, true);
    equal(out.nextIncomingAt, 1600);
    equal(out.dueNow, false);
  });

  test('disabled incoming call does not schedule', function () {
    var out = core().reconcileIncomingCallPlan({ enabled: true, allowIncoming: false, allowVoiceIncoming: true, allowVideoIncoming: true, nextIncomingAt: 2000, plannedSessionId: 'a' }, 'a', 1000, function () { return 600; });
    equal(out.shouldSchedule, false);
    equal(out.nextIncomingAt, 0);
  });

  test('legacy behavior settings migrate to safe defaults without overwriting explicit values', function () {
    var migrated = core().normalizeBehaviorSettings({ fixedCardReplyCount: 4, autoStickerChance: 80 });
    equal(migrated.randomCardComboEnabled, false);
    equal(migrated.fixedCardReplyCount, 4);
    equal(migrated.randomCardComboMin, 2);
    equal(migrated.randomCardComboMax, 3);
    equal(migrated.autoStickerEnabled, false);
    equal(migrated.autoStickerChance, 80);
    equal(migrated.autoStickerInterval, 5);
  });

  test('reply compose keeps relation without original-letter preview', function () {
    var compose = core().buildReplyComposeState({ id: 'letter-7', title: '很长的原信', content: '不应出现在编辑页的全文' });
    equal(compose.replyToId, 'letter-7');
    equal(compose.subject, '回复 · 很长的原信');
    equal(Object.prototype.hasOwnProperty.call(compose, 'originalPreview'), false);
    equal(Object.prototype.hasOwnProperty.call(compose, 'content'), false);
  });

  test('normalizing one conversation does not mutate another conversation', function () {
    var first = { autoStickerEnabled: true, fixedCardReplyCount: 4 };
    var second = { autoStickerEnabled: false, fixedCardReplyCount: 2 };
    var normalizedFirst = core().normalizeBehaviorSettings(first);
    equal(normalizedFirst.autoStickerEnabled, true);
    equal(normalizedFirst.fixedCardReplyCount, 4);
    equal(second.autoStickerEnabled, false);
    equal(second.fixedCardReplyCount, 2);
  });

  var result = document.getElementById('result');
  if (failures.length) {
    document.body.dataset.status = 'failed';
    result.textContent = 'FAIL ' + failures.length + '\n' + failures.join('\n');
  } else {
    document.body.dataset.status = 'passed';
    result.textContent = 'PASS ' + passed;
  }
})();
</script>

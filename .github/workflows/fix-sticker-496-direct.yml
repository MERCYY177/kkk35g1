name: Runtime verify 496 sticker recovery

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver library
        run: python -m pip install --quiet selenium
      - name: Run real-browser stale-hidden recovery test
        shell: bash
        run: |
          cat > blank.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>blank</title>
          EOF
          python -m http.server 8000 >/tmp/xs-http.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          import re,json,time,shutil
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait

          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script[^>]+id=["\']xiaoshu-builtin-sticker-packs-data-v1["\'][^>]*>(.*?)</script>',s,re.S|re.I)
          assert m,'builtin corpus missing'
          packs=json.loads(m.group(1))
          refs=[str(i.get('src','')).strip() for p in packs for i in (p.get('items') or []) if isinstance(i,dict) and str(i.get('src','')).strip()]
          refs=list(dict.fromkeys(refs))
          assert len(refs)==496,len(refs)

          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          assert chrome,'Chrome/Chromium not found on runner'
          opt=Options(); opt.binary_location=chrome
          for arg in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1280,1200']:
              opt.add_argument(arg)
          d=webdriver.Chrome(options=opt)
          wait=WebDriverWait(d,35)
          try:
              d.get('http://127.0.0.1:8000/blank.html')
              # Reproduce the user's poisoned browser state: hundreds of wanted builtins were persisted hidden.
              d.execute_script("localStorage.setItem('disabledStickerItems', JSON.stringify(arguments[0]));",refs[:330])
              d.execute_script("localStorage.setItem('xiaoshu_hidden_sticker_items_v7', JSON.stringify(arguments[0]));",refs[330:410])
              d.execute_script("sessionStorage.setItem('disabledStickerItems', JSON.stringify(arguments[0]));",refs[410:430])
              d.get('http://127.0.0.1:8000/index.html')
              wait.until(lambda x:x.execute_script("return !!(window.xiaoshuStickerStore&&window.xiaoshuStickerStore.getPool)"))
              wait.until(lambda x:x.execute_script("return localStorage.getItem('xiaoshu_builtin_sticker_visibility_496_v1')==='1'"))
              wait.until(lambda x:x.execute_script("return window.xiaoshuStickerStore.getPool().length===496"))
              pool=d.execute_script("return window.xiaoshuStickerStore.getPool().slice();")
              hidden=d.execute_script("return window.xiaoshuStickerStore.getHidden().slice();")
              marker=d.execute_script("return localStorage.getItem('xiaoshu_builtin_sticker_visibility_496_v1');")
              canon_hidden=sum(1 for x in refs if x in hidden)
              print('RUNTIME pool after poisoned-state recovery =',len(pool))
              print('RUNTIME canonical stickers still hidden =',canon_hidden)
              print('RUNTIME repair marker =',marker)
              assert len(pool)==496
              assert canon_hidden==0
              assert marker=='1'

              # Prove it is one-time recovery, not a permanent ban on the hide feature.
              chosen=pool[0]
              d.execute_script("window.xiaoshuStickerStore.hide(arguments[0],true);",chosen)
              wait.until(lambda x:x.execute_script("return window.xiaoshuStickerStore.getPool().length===495"))
              d.refresh()
              wait.until(lambda x:x.execute_script("return !!(window.xiaoshuStickerStore&&window.xiaoshuStickerStore.getPool)"))
              wait.until(lambda x:x.execute_script("return window.xiaoshuStickerStore.getPool().length===495"))
              after=d.execute_script("return window.xiaoshuStickerStore.getPool().length;")
              print('RUNTIME pool after intentional post-repair hide + reload =',after)
              assert after==495
              print('RUNTIME_BROWSER_TEST_PASSED')
          finally:
              d.quit()
          PY

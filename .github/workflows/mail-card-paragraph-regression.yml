name: Mail card paragraph regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mail-card-paragraph-regression.yml'
      - 'tools/test_mail_card_paragraphs.py'
      - 'tools/fix_mail_card_paragraphs.py'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mail card paragraph regression
        run: python tools/test_mail_card_paragraphs.py

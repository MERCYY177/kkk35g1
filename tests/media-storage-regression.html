<!doctype html>
<meta charset="utf-8">
<title>Media storage regression</title>
<body data-status="running"><pre id="result">RUNNING</pre>
<script src="../media-core.js"></script>
<script>
(async function () {
  'use strict';
  var passed = 0;
  function assert(value, message) { if (!value) throw new Error(message || 'assertion failed'); passed += 1; }
  function equal(actual, expected, message) { assert(actual === expected, (message || 'values differ') + ' (actual=' + actual + ', expected=' + expected + ')'); }
  try {
    var core = window.XiaoshuMediaCore;
    assert(core, 'media core must load');

    var cache = Object.create(null), persisted = Object.create(null), fallbackCalls = 0;
    var repo = core.createMediaRepository({
      setItem: async function (key, value) { persisted[key] = value; },
      getItem: async function (key) { return Object.prototype.hasOwnProperty.call(persisted, key) ? persisted[key] : null; },
      removeItem: async function (key) { delete persisted[key]; },
      keys: async function () { return Object.keys(persisted); },
      fallbackSet: function () { fallbackCalls += 1; }
    }, cache);
    await repo.putVerified('leaf_key', 'data:image/png;base64,QQ==', { kind: 'leaf', index: 1 });
    equal(cache.leaf_key, 'data:image/png;base64,QQ==', 'cache commits after verified persistence');
    equal(fallbackCalls, 0, 'media repository never calls localStorage fallback');

    var failedCache = Object.create(null), failedRepo = core.createMediaRepository({
      setItem: async function () { var error = new Error('denied'); error.name = 'SecurityError'; throw error; },
      getItem: async function () { return null; }, removeItem: async function () {}, keys: async function () { return []; }
    }, failedCache);
    var failedCode = '';
    try { await failedRepo.putVerified('bad_key', 'data:image/png;base64,Qg==', { kind: 'leaf', index: 2 }); }
    catch (error) { failedCode = error.code; }
    equal(failedCode, 'WRITE_DENIED', 'write denial is classified');
    equal(Object.keys(failedCache).length, 0, 'failed write creates no cache preview');

    var verifyRepo = core.createMediaRepository({
      setItem: async function () {}, getItem: async function () { return 'different'; }, removeItem: async function () {}, keys: async function () { return []; }
    }, Object.create(null));
    var verifyCode = '';
    try { await verifyRepo.putVerified('verify_key', 'data:image/png;base64,Qw==', { kind: 'leaf', index: 3 }); }
    catch (error) { verifyCode = error.code; }
    equal(verifyCode, 'VERIFY_FAILED', 'write-after-read mismatch is classified');

    var quota = new Error('quota full'); quota.name = 'QuotaExceededError';
    equal(core.classifyMediaError(quota, 'write').code, 'QUOTA_EXCEEDED', 'quota error is distinct');
    equal(core.classifyMediaError(new Error('IndexedDB open blocked'), 'open').code, 'DB_BLOCKED', 'blocked database is distinct');
    equal(core.classifyMediaError(new Error('decode failed'), 'decode').code, 'IMAGE_DECODE', 'decode error is distinct');
    equal(core.classifyMediaError(new Error('canvas failed'), 'canvas').code, 'CANVAS_FAILED', 'canvas error is distinct');

    var migrated = core.normalizeMailboxStateV6({ version: 5, items: [{ id: 'old', type: 'received', content: '旧信', read: false }] });
    equal(migrated.version, 6, 'mailbox state migrates to v6');
    assert(Array.isArray(migrated.items[0].images) && migrated.items[0].images.length === 0, 'old letters receive an empty images array');
    var scoped = core.normalizeMailboxStateV6({ items: [{ id: 'new', type: 'sent', images: ['mailimg_s1_a', 'bad', 'mailimg_s1_b', 'mailimg_s1_c', 'mailimg_s1_d', 'mailimg_s1_e'] }] }, { sessionToken: 's1' });
    equal(scoped.items[0].images.length, 4, 'mail images are validated, scoped and capped at four');

    var referenced = core.collectMailMediaRefs({ items: [{ images: ['mailimg_s1_a', 'mailimg_s1_b'] }, { images: ['mailimg_s1_b'] }] });
    equal(referenced.size, 2, 'mail references are deduplicated');
    var garbage = core.findUnreferencedMedia(['prefix_mailimg_s1_a', 'prefix_mailimg_s1_z'], 'prefix_', referenced, new Set());
    equal(garbage.length, 1, 'garbage collection preserves referenced media');
    equal(garbage[0], 'prefix_mailimg_s1_z');

    document.body.dataset.status = 'passed';
    document.getElementById('result').textContent = 'PASS ' + passed;
  } catch (error) {
    document.body.dataset.status = 'failed';
    document.getElementById('result').textContent = 'FAIL ' + (error && error.stack || error);
  }
})();
</script>

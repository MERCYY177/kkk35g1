name: Diagnose final fix targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-drawer-beautify.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract final target source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          def extract_func(name,occ=0):
              ms=list(re.finditer(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',s))
              out.append(f'\n=== FUNCTION {name} matches={len(ms)} occ={occ} ===')
              if len(ms)<=occ:return
              st=ms[occ].start(); brace=s.find('{',ms[occ].start(),ms[occ].end()+2);depth=0;quote=None;esc=False;i=brace
              while i<len(s):
                  c=s[i]
                  if quote:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c==quote:quote=None
                  else:
                      if c in "'\"`":quote=c
                      elif c=='{':depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:out.append(s[st:i+1]);return
                  i+=1
          for n in ['writeEventOnce','builtinPacks','itemSrc','sendBigKeyboardStickers','bindBigKeyboardStorage','bigKeyboardStickerPool','appendSharedStickerBatch','bindSharedStickerGrid']:
              extract_func(n)
          out.append('\n=== sendBigKeyboardStickers REFERENCES ===')
          for m in re.finditer(r'sendBigKeyboardStickers\s*\(',s):out.append(s[max(0,m.start()-900):min(len(s),m.end()+1300)])
          out.append('\n=== BIG KEYBOARD MESSAGE REFERENCES ===')
          for m in re.finditer(r'xiaoshu-big-keyboard-stickers-(?:state|request)',s):out.append(s[max(0,m.start()-900):min(len(s),m.end()+1200)])
          out.append('\n=== CALL EVENT CSS CANDIDATES ===')
          # collect CSS blocks whose selector/body mentions call event classes or phone-slash icons nearby
          for m in re.finditer(r'[^{}]{0,180}\{[^{}]{0,1200}\}',s):
              b=m.group(0)
              if re.search(r'(?:call-event|phone-slash|call.*message|message.*call|xs.*call.*pill|system.*call)',b,re.I):out.append(b)
          out.append('\n=== BUILTIN STICKER STATIC FACTS ===')
          # report arrays/JSON with assets/stickers refs and counts around builtinPacks function
          bp=s.find('function builtinPacks')
          if bp>=0:out.append(s[max(0,bp-12000):bp+5000])
          # Beauty same-theme selector comparison for common themes
          out.append('\n=== BEAUTY COMMON PAIRS ===')
          m=re.search(r'<script id="xiaoshu-builtin-bubble-css-data" type="application/json">(.*?)</script>',s,re.S)
          km=re.search(r'const BUILTIN_KEYBOARD_BEAUTY_STYLES=(\[.*?\]);\s*let editingKeyboardBeautyId',s,re.S)
          main=json.loads(m.group(1)) if m else []; kb=json.loads(km.group(1)) if km else []
          def body(n):return re.sub(r'^\d{1,2}[_. -]*','',str(n or ''))
          a={body(x.get('name')):x for x in main};b={body(x.get('name')):x for x in kb}
          for name in ['eve_iMessage蓝版','仿WhatsApp灰白上角尾巴','JRYS兔丸粉白奶黄','LineKitty黑边白气泡']:
              if name in a and name in b:
                  out.append('\n--- '+name+' CHAT1 ---\n'+str(a[name].get('chatCss',''))[:8000])
                  out.append('\n--- '+name+' CHAT2 ---\n'+str(b[name].get('css',''))[:8000])
          text='\n'.join(out)
          Path('_diag_final.txt').write_text(text,encoding='utf-8')
          print('final diagnostic chars',len(text)); print(text[:16000])
          PY
      - name: Commit final diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _diag_final.txt
          git commit -m 'test: record final fix targets'
          git push

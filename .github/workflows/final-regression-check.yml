name: Final integrated regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-regression-check.yml'
      - 'tools/final_regression_check.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integrated regression assertions
        run: python tools/final_regression_check.py
      - name: Check every inline JavaScript block
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8'); checked=0
          for i,m in enumerate(re.finditer(r'<script\b([^>]*)>(.*?)</script>',html,re.I|re.S),1):
              attrs,code=m.group(1),m.group(2)
              if re.search(r'\bsrc\s*=',attrs,re.I):
                  continue
              tm=re.search(r'\btype\s*=\s*["\']([^"\']+)["\']',attrs,re.I)
              if tm and tm.group(1).lower() not in ('text/javascript','application/javascript','module'):
                  continue
              suffix='.mjs' if tm and tm.group(1).lower()=='module' else '.js'
              with tempfile.NamedTemporaryFile('w',suffix=suffix,encoding='utf-8',delete=False) as f:
                  f.write(code); name=f.name
              r=subprocess.run(['node','--check',name],text=True,capture_output=True)
              if r.returncode:
                  print(f'inline script #{i} failed syntax check')
                  print(r.stderr)
                  raise SystemExit(r.returncode)
              checked+=1
          print(f'INLINE_JS_OK={checked}')
          PY
      - name: Report repository production footprint
        run: |
          echo "INDEX_BYTES=$(wc -c < index.html)"
          echo "THEME_FILES=$(find assets/builtin-theme -type f | wc -l)"
          echo "THEME_BYTES=$(find assets/builtin-theme -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')"

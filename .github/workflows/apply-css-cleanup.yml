name: Apply requested CSS cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-css-cleanup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact CSS cleanup and restore rabbit theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,subprocess

          path=Path('index.html')
          s=path.read_text(encoding='utf-8')
          original=s

          target_names={
            '07_eve_iMessage透明蓝版',
            '08_eve_iMessage透明绿版',
            '10_eve_iMessage蓝灰圆弧尾巴',
            '12_Miu_微信版',
            '13_Miu_日间浅蓝版',
            '14_miu_iMessage透明绿版',
            '15_miu_iMessage透明黑版',
            '21_miu简讯紫',
            '25_淡盐气泡_通过版',
            '27_氧气感粉色_通过版',
            '28_Eve古早微信灰黑_通过版',
          }
          rabbit_id='builtin_xiaoshu_jrys_tuwan_pink_kkk35g_v1'
          rabbit_kb_id='builtin_parent_builtin_xiaoshu_jrys_tuwan_pink_kkk35g_v1'
          kitty_id='builtin_xiaoshu_line_kitty_black_white_kkk35g_v1'
          kitty_kb_id='builtin_parent_builtin_xiaoshu_line_kitty_black_white_kkk35g_v1'
          phase_ids={
            'builtin_xiaoshu_ig_mono_system_v1',
            'builtin_xiaoshu_ig_gradient_system_v1',
            'builtin_xiaoshu_wechat_system_v1',
            'builtin_xiaoshu_ios6_retro_system_v1',
          }

          old=subprocess.check_output(
            ['git','show','eb322d951c021c4e09c7c1a0347358c60ab51be6:index.html'],
            text=True,encoding='utf-8'
          )

          def bubble_match(text):
            m=re.search(r'(<script id="xiaoshu-builtin-bubble-css-data" type="application/json">)(.*?)(</script>)',text,re.S)
            if not m: raise AssertionError('bubble registry missing')
            return m
          def kb_match(text):
            m=re.search(r'(const BUILTIN_KEYBOARD_BEAUTY_STYLES=)(\[.*?\])(;)',text,re.S)
            if not m: raise AssertionError('keyboard registry missing')
            return m

          # Load original rabbit CSS exactly as first shipped.
          om=bubble_match(old)
          old_bubbles=json.loads(om.group(2))
          old_rabbit=next(x for x in old_bubbles if x.get('id')==rabbit_id)
          okm=kb_match(old)
          old_kb=json.loads(okm.group(2))
          old_rabbit_kb=next(x for x in old_kb if x.get('id')==rabbit_kb_id)

          # Main chat CSS registry: exact deletions only, preserve Kitty and Rabbit.
          m=bubble_match(s)
          bubbles=json.loads(m.group(2))
          before_names=[x.get('name') for x in bubbles]
          missing=sorted(target_names-set(before_names))
          if missing: raise AssertionError('requested bubble presets missing before edit: '+repr(missing))
          if not any(x.get('id')==kitty_id for x in bubbles): raise AssertionError('HelloKitty missing before edit')
          if not any(x.get('id')==rabbit_id for x in bubbles): raise AssertionError('Rabbit missing before edit')
          new_bubbles=[]
          for x in bubbles:
            if x.get('name') in target_names:
              continue
            if x.get('id')==rabbit_id:
              x=dict(x)
              x['chatCss']=old_rabbit['chatCss']
            new_bubbles.append(x)
          if len(bubbles)-len(new_bubbles)!=len(target_names):
            raise AssertionError(f'expected {len(target_names)} bubble removals, got {len(bubbles)-len(new_bubbles)}')
          bubble_json=json.dumps(new_bubbles,ensure_ascii=False,separators=(',',':'))
          s=s[:m.start(2)]+bubble_json+s[m.end(2):]

          # Keyboard CSS registry: remove only exact counterparts; do not remove other styles sharing a number.
          km=kb_match(s)
          kb=json.loads(km.group(2))
          kb_target={x['name'] for x in kb if x.get('name') in target_names}
          if kb_target!=target_names:
            raise AssertionError('keyboard counterparts mismatch: '+repr(sorted(target_names-kb_target)))
          if not any(x.get('id')==kitty_kb_id for x in kb): raise AssertionError('HelloKitty keyboard missing before edit')
          if not any(x.get('id')==rabbit_kb_id for x in kb): raise AssertionError('Rabbit keyboard missing before edit')
          new_kb=[]
          for x in kb:
            if x.get('name') in target_names:
              continue
            if x.get('id')==rabbit_kb_id:
              x=dict(x)
              x['css']=old_rabbit_kb['css']
            new_kb.append(x)
          if len(kb)-len(new_kb)!=len(target_names):
            raise AssertionError(f'expected {len(target_names)} keyboard removals, got {len(kb)-len(new_kb)}')
          kb_json=json.dumps(new_kb,ensure_ascii=False,separators=(',',':'))
          s=s[:km.start(2)]+kb_json+s[km.end(2):]

          # Remove only the four newly appended follow-system themes.
          phase_pat=re.compile(r'/\* v105 phase 1: four chat-1 themes ported from the user\'s reference CSS\..*?var XIAOSHU_PHASE1_BUILTINS=\[.*?\n\];\n',re.S)
          s,n=phase_pat.subn('',s,count=1)
          if n!=1: raise AssertionError(f'phase1 block removal count {n}')
          old_get="BUILTIN=readJson('xiaoshu-builtin-bubble-css-data',[]).concat(XIAOSHU_PHASE1_BUILTINS);"
          new_get="BUILTIN=readJson('xiaoshu-builtin-bubble-css-data',[]);"
          if s.count(old_get)!=1: raise AssertionError('unexpected getBuiltin concat count')
          s=s.replace(old_get,new_get,1)

          # Replace the unsupported FontAwesome ellipsis icon with a real text ellipsis.
          old_more='b.innerHTML=\'<i class="fas fa-ellipsis-h"></i>\';'
          new_more="b.textContent='⋯';"
          if s.count(old_more)!=1: raise AssertionError('more-button icon source count is not 1')
          s=s.replace(old_more,new_more,1)

          # Post-edit semantic assertions.
          pm=bubble_match(s); post_bubbles=json.loads(pm.group(2))
          pkm=kb_match(s); post_kb=json.loads(pkm.group(2))
          post_names={x.get('name') for x in post_bubbles}
          post_kb_names={x.get('name') for x in post_kb}
          assert not (target_names & post_names), target_names & post_names
          assert not (target_names & post_kb_names), target_names & post_kb_names
          assert all(pid not in s for pid in phase_ids)
          assert 'XIAOSHU_PHASE1_BUILTINS' not in s
          assert any(x.get('id')==kitty_id for x in post_bubbles)
          assert any(x.get('id')==kitty_kb_id for x in post_kb)
          pr=next(x for x in post_bubbles if x.get('id')==rabbit_id)
          pkr=next(x for x in post_kb if x.get('id')==rabbit_kb_id)
          assert pr['chatCss']==old_rabbit['chatCss']
          assert pkr['css']==old_rabbit_kb['css']
          assert 'fa-ellipsis-h' not in s
          assert "b.textContent='⋯';" in s
          assert s!=original

          path.write_text(s,encoding='utf-8')
          print('bubble count',len(bubbles),'->',len(post_bubbles))
          print('keyboard count',len(kb),'->',len(post_kb))
          print('kept HelloKitty and restored Rabbit; removed four follow-system themes; more button is text ellipsis')
          PY
          git diff --check
          git diff --stat
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: clean requested CSS presets and restore rabbit theme"
          git push

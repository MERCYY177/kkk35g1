name: Incoming call type guard regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/incoming-call-type-guard-regression.yml'
      - 'tools/test_incoming_call_type_guard.py'
      - 'tools/fix_incoming_call_type_guard.py'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run incoming call type guard regression
        run: python tools/test_incoming_call_type_guard.py

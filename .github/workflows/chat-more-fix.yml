name: Fix chat more menu

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chat-more-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Red - prove current bug is present
        shell: bash
        run: |
          set +e
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          checks = {
              'bare more-button': '#xs-chat-more-button{width:44px;height:44px;margin:3px 10px 3px auto;border:0;border-radius:0;background:transparent' in s,
              'menu rows forced vertical': '.xs-chat-more-menu.show{display:grid!important;grid-template-columns:1fr!important' in s,
              'no disabled call menu entries': "(c.enabled?'':'disabled')" not in s,
              'direct pointer handler exists': 'function bindMoreMenuActions(h)' in s and "btn.addEventListener('pointerup'" in s,
              'disabled calls open settings': "toast('请先在通话设置中启用模拟通话','info');return openSettings()" in s,
          }
          print('pre-fix desired-state checks:', checks)
          raise SystemExit(0 if all(checks.values()) else 1)
          PY
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression unexpectedly already passes; refusing to patch.'
            exit 1
          fi
          echo 'RED confirmed: desired state is not present before patch.'

      - name: Patch only chat more button and menu interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old_button = "#xs-chat-more-button{width:44px;height:44px;margin:3px 10px 3px auto;border:1px solid var(--border-color);border-radius:50%;background:var(--secondary-bg);color:var(--text-primary);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent}"
          new_button = "#xs-chat-more-button{width:44px;height:44px;margin:3px 10px 3px auto;border:0;border-radius:0;background:transparent;color:var(--text-primary);display:flex;align-items:center;justify-content:center;padding:0;font-size:25px;line-height:1;cursor:pointer;box-shadow:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}"
          assert s.count(old_button) == 1, f'expected one old button rule, got {s.count(old_button)}'
          s = s.replace(old_button, new_button, 1)

          old_active = "#xs-chat-more-button:active{transform:scale(.94);background:var(--primary-bg)}"
          new_active = "#xs-chat-more-button:active{transform:scale(.94);background:transparent;opacity:.58}"
          assert s.count(old_active) == 1, f'expected one old active rule, got {s.count(old_active)}'
          s = s.replace(old_active, new_active, 1)

          old_menu_css = ".xs-chat-more-menu{position:fixed;z-index:1000010;display:none;min-width:168px;padding:8px;border:1px solid var(--border-color);border-radius:16px;background:var(--secondary-bg);box-shadow:0 14px 40px rgba(0,0,0,.22);font-family:var(--font-family)}\n.xs-chat-more-menu.show{display:grid;gap:4px}.xs-chat-more-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;padding:0 12px;border:0;border-radius:11px;background:transparent;color:var(--text-primary);font:inherit;text-align:left;cursor:pointer}.xs-chat-more-menu button:hover{background:var(--primary-bg)}.xs-chat-more-menu button:disabled{opacity:.4;cursor:not-allowed}.xs-chat-more-menu i{width:18px;text-align:center}"
          new_menu_css = ".xs-chat-more-menu{position:fixed!important;z-index:1000010!important;display:none;min-width:176px;padding:8px;border:1px solid var(--border-color);border-radius:14px;background:var(--secondary-bg);box-shadow:0 14px 40px rgba(0,0,0,.22);font-family:var(--font-family);pointer-events:auto!important;isolation:isolate}\n.xs-chat-more-menu.show{display:grid!important;grid-template-columns:1fr!important;gap:4px!important}.xs-chat-more-menu button{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;width:100%!important;min-height:44px!important;padding:0 12px!important;border:0!important;border-radius:10px!important;background:transparent!important;color:var(--text-primary)!important;font:inherit!important;text-align:left!important;cursor:pointer!important;pointer-events:auto!important;touch-action:manipulation}.xs-chat-more-menu button:hover,.xs-chat-more-menu button:active{background:var(--primary-bg)!important}.xs-chat-more-menu button span{display:inline!important;visibility:visible!important;opacity:1!important}.xs-chat-more-menu i{display:inline-flex!important;width:18px!important;text-align:center!important;flex:0 0 18px!important}"
          assert s.count(old_menu_css) == 1, f'expected one old menu css block, got {s.count(old_menu_css)}'
          s = s.replace(old_menu_css, new_menu_css, 1)

          old_toggle = "function toggleMoreMenu(){var b=ensureCallButton(),h=moreMenu();if(h.classList.contains('show'))return closeMoreMenu();var c=settingsFor(sid()),r=b.getBoundingClientRect();h.innerHTML='<button type=\"button\" role=\"menuitem\" tabindex=\"-1\" data-v118-more-call=\"voice\" '+(c.enabled?'':'disabled')+'><i class=\"fas fa-phone\"></i><span>语音通话</span></button><button type=\"button\" role=\"menuitem\" tabindex=\"-1\" data-v118-more-call=\"video\" '+(c.enabled?'':'disabled')+'><i class=\"fas fa-video\"></i><span>视频通话</span></button><button type=\"button\" role=\"menuitem\" tabindex=\"-1\" data-v118-more-settings><i class=\"fas fa-cog\"></i><span>通话设置</span></button>';h.style.top=Math.min(innerHeight-170,r.bottom+6)+'px';h.style.right=Math.max(8,innerWidth-r.right)+'px';h.classList.add('show');b.setAttribute('aria-expanded','true');return false}"
          new_toggle = "function runMoreMenuAction(kind){if(kind==='settings')return openSettings();var c=settingsFor(sid());if(!c.enabled){toast('请先在通话设置中启用模拟通话','info');return openSettings()}return startOutgoing(kind)}\nfunction bindMoreMenuActions(h){if(!h)return;h.querySelectorAll('button').forEach(function(btn){if(btn.__xsMorePointerBound)return;btn.__xsMorePointerBound=true;btn.addEventListener('pointerup',function(e){e.preventDefault();e.stopPropagation();var kind=btn.getAttribute('data-v118-more-call')||'settings';closeMoreMenu();return runMoreMenuAction(kind)},{passive:false})})}\nfunction toggleMoreMenu(){var b=ensureCallButton(),h=moreMenu();if(h.classList.contains('show'))return closeMoreMenu();var r=b.getBoundingClientRect();h.innerHTML='<button type=\"button\" role=\"menuitem\" tabindex=\"-1\" data-v118-more-call=\"voice\"><i class=\"fas fa-phone\"></i><span>语音通话</span></button><button type=\"button\" role=\"menuitem\" tabindex=\"-1\" data-v118-more-call=\"video\"><i class=\"fas fa-video\"></i><span>视频通话</span></button><button type=\"button\" role=\"menuitem\" tabindex=\"-1\" data-v118-more-settings><i class=\"fas fa-cog\"></i><span>通话设置</span></button>';h.style.top=Math.min(innerHeight-170,r.bottom+6)+'px';h.style.right=Math.max(8,innerWidth-r.right)+'px';bindMoreMenuActions(h);h.classList.add('show');b.setAttribute('aria-expanded','true');return false}"
          assert s.count(old_toggle) == 1, f'expected one old toggleMoreMenu, got {s.count(old_toggle)}'
          s = s.replace(old_toggle, new_toggle, 1)

          old_click_call = "var mc=t.call(e.target,'[data-v118-more-call]');if(mc){e.preventDefault();closeMoreMenu();return startOutgoing(mc.getAttribute('data-v118-more-call'))}if(t.call(e.target,'[data-v118-more-settings]')){e.preventDefault();closeMoreMenu();return openSettings()}"
          new_click_call = "var mc=t.call(e.target,'[data-v118-more-call]');if(mc){e.preventDefault();closeMoreMenu();return runMoreMenuAction(mc.getAttribute('data-v118-more-call'))}if(t.call(e.target,'[data-v118-more-settings]')){e.preventDefault();closeMoreMenu();return runMoreMenuAction('settings')}"
          assert s.count(old_click_call) == 1, f'expected one old delegated menu action block, got {s.count(old_click_call)}'
          s = s.replace(old_click_call, new_click_call, 1)

          assert s != original
          p.write_text(s, encoding='utf-8')
          print('patched index.html bytes:', len(original), '->', len(s))
          print('sha256 before:', hashlib.sha256(original.encode()).hexdigest())
          print('sha256 after :', hashlib.sha256(s.encode()).hexdigest())
          PY

      - name: Green - verify regression and scope
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          old_button = "#xs-chat-more-button{width:44px;height:44px;margin:3px 10px 3px auto;border:1px solid var(--border-color);border-radius:50%;background:var(--secondary-bg);color:var(--text-primary);display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent}"
          old_active = "#xs-chat-more-button:active{transform:scale(.94);background:var(--primary-bg)}"
          checks = {
              'bare more-button': '#xs-chat-more-button{width:44px;height:44px;margin:3px 10px 3px auto;border:0;border-radius:0;background:transparent' in s,
              'old circular more-button gone': old_button not in s,
              'old active background gone': old_active not in s,
              'active state stays transparent': '#xs-chat-more-button:active{transform:scale(.94);background:transparent;opacity:.58}' in s,
              'vertical menu forced': '.xs-chat-more-menu.show{display:grid!important;grid-template-columns:1fr!important;gap:4px!important}' in s,
              'labels forced visible': '.xs-chat-more-menu button span{display:inline!important;visibility:visible!important;opacity:1!important}' in s,
              'pointer events enabled': 'pointer-events:auto!important;touch-action:manipulation' in s,
              'no disabled call items': "(c.enabled?'':'disabled')" not in s,
              'direct pointer binding': "function bindMoreMenuActions(h)" in s and "btn.addEventListener('pointerup'" in s,
              'disabled feature opens settings': "toast('请先在通话设置中启用模拟通话','info');return openSettings()" in s,
              'voice label preserved': '<span>语音通话</span>' in s,
              'video label preserved': '<span>视频通话</span>' in s,
              'settings label preserved': '<span>通话设置</span>' in s,
              'call core preserved': 'function startOutgoing(kind)' in s and 'function openSettings()' in s,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'), k)
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('failed: '+', '.join(failed))
          PY
          git diff --check
          echo 'Changed files:'
          git diff --name-only
          test "$(git diff --name-only)" = "index.html"

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: make chat more menu usable'
          git push

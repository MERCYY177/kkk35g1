name: Retire Shop leftovers v2

on:
  push:
    paths:
      - '.github/workflows/retire-shop-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final trim
        run: python tools/final_shop_trim.py
      - name: Final sanity checks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          forbidden=[
            "btn('gift','礼物柜')","btn('wallet','卡包')","showGiftCabinetApp","var WALLET_KEY=",
            "loadJSON('shop_gift_cabinet'","id:'shop', label:'历史订单 / 礼物柜数据（兼容）'",
            "shop:{id:'shop',live:'historical-storage-only'","openShopDb","readShopStrict","writeShopStrict",
            "clearShopStrict","openShopV99","shopReadMap","shopReplaceMap","captureShopCore","normalizeShopData",
            "normalizeRescueShopRaw","inclShop","sel.shop","seen.shop","shopExpected","shopRestored",
            '.fa-shopping-cart::before','.fa-store::before','.fa-wallet::before','.fa-cart-plus::before','.fa-ticket-alt::before'
          ]
          bad=[x for x in forbidden if x in s]
          if bad: raise SystemExit('Final Shop residuals remain: '+repr(bad))
          # ShopDB is allowed exactly once: the one-time migration that deletes the retired DB.
          if s.count('ShopDB') != 1 or "indexedDB.deleteDatabase('ShopDB')" not in s:
              raise SystemExit('Unexpected ShopDB residual count/context')
          # Legacy storage keys are allowed only inside the one-time retirement script.
          marker='xiaoshu-retired-commerce-cleanup-v1'
          if s.count(marker)!=1: raise SystemExit('retirement migration marker invalid')
          required=['收藏','朋友圈','相册','相机','电话','短信','callRecordsV2','productFromItem','productRow']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Required feature markers missing: '+repr(missing))
          print('Final Shop sanity checks passed')
          PY
      - name: Commit final trim
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refactor: trim final inactive Shop remnants'
          git push

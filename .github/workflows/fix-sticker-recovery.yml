name: Cleanup sticker recovery tooling

on:
  push:
    paths:
      - '.github/workflows/fix-sticker-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repaired sticker state before cleanup
        run: python tools/test_sticker_recovery.py
      - name: Verify business fix is still present
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          text=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script[^>]+id=["\']xiaoshu-builtin-sticker-packs-data-v1["\'][^>]*>(.*?)</script>',text,re.S|re.I)
          data=json.loads(m.group(1))
          refs={str(it.get('src','')).strip() for p in data for it in (p.get('items') or []) if isinstance(it,dict) and str(it.get('src','')).strip()}
          assets={p.as_posix() for p in Path('assets/stickers').rglob('*') if p.is_file()}
          if refs != assets: raise SystemExit(f'pack/assets mismatch refs={len(refs)} assets={len(assets)}')
          if "assets/stickers/" not in text[text.find("function safeResourceUrl(value,kind='image'){"):text.find("function safeCssUrl",text.find("function safeResourceUrl(value,kind='image'){"))]:
              raise SystemExit('Chat2 local sticker guard missing')
          print('FINAL PRE-CLEAN VERIFY GREEN',len(refs))
          PY
      - name: Remove temporary sticker recovery tooling
        shell: bash
        run: |
          git rm .github/workflows/diag-sticker-recovery.yml \
                 .github/workflows/fix-sticker-recovery.yml \
                 tools/test_sticker_recovery.py \
                 tools/fix_sticker_recovery.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary sticker recovery tooling'
          git push origin HEAD:main

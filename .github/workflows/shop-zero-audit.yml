name: Zero Shop residual audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map every remaining Shop substring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()

          required=['xiaoshu-coupon-chat-card','red-packet-card','transfer-bubble','m.redPacket','m.transfer','收藏','朋友圈','相册','相机','电话','短信','callRecordsV2']
          missing=[x for x in required if x not in s]
          print('missing:',missing)

          print('=== EVERY shop/Shop substring line ===')
          hits=[]
          for n,line in enumerate(lines,1):
              if 'shop' in line.lower():
                  hits.append((n,line.rstrip()))
                  print(f'L{n}: {line.rstrip()}')
          print('shop substring line count:',len(hits))

          print('=== EVERY exact share-type line ===')
          for n,line in enumerate(lines,1):
              if re.search(r"\btype\s*={2,3}\s*['\"]share['\"]",line):
                  print(f'L{n}: {line.rstrip()}')

          print('=== backup validator context ===')
          for lo,hi in [(2025,2112),(9588,9650),(4528,4552),(21220,21235)]:
              print(f'--- L{lo}-L{hi} ---')
              for n in range(lo,min(hi,len(lines))+1):
                  print(f'{n}: {lines[n-1]}')

          if missing: raise SystemExit('current feature regression: '+repr(missing))
          print('full Shop substring mapping complete')
          PY
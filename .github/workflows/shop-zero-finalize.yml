name: One-time final Shop cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shop-zero-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove final Shop semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          before=s
          pairs=[
            ("var cats=categoryIdsPresent(lf,ls,shop);", "var cats=categoryIdsPresent(lf,ls);"),
            ("mediaCount:mediaCount,shopStores:Object.keys(shop).length,ignored:stats.ignored", "mediaCount:mediaCount,ignored:stats.ignored"),
            ("if (text && (type === 'normal' || type === 'share')) {", "if (text && type === 'normal') {"),
            ("if (backupCategory === 'shop' || backupCategory === 'map') return false;", "if (backupCategory === 'map') return false;"),
            ("'CHAT_APP_', 'ta_phone_', 'xiaoshu_', 'moments_', 'shop_', 'dg_',", "'CHAT_APP_', 'ta_phone_', 'xiaoshu_', 'moments_', 'dg_',"),
            (",shopTimeout:12000", ""),
            ("|moments_|shop_|ta_phone_", "|moments_|ta_phone_"),
            ("delete payload.manifest.shopStores;", ""),
            ("live Shop/HomeDoor/sticker/beautify overlays", "live HomeDoor/sticker/beautify overlays")
          ]
          for old,new in pairs:
              c=s.count(old)
              assert c==1, f'expected one occurrence, got {c}: {old!r}'
              s=s.replace(old,new,1)
          shop_lines=[(n,l.rstrip()) for n,l in enumerate(s.splitlines(),1) if 'shop' in l.lower()]
          if shop_lines:
              print('remaining shop lines:',shop_lines)
              raise SystemExit('Shop substring remains')
          if re.search(r"\btype\s*={2,3}\s*['\"]share['\"]",s):
              raise SystemExit('retired share type remains')
          legacy=['shareData','productData','orderData','cardData','giftData','couponData','pay-request','商品','帮我买','cardTag','renderWallet','showCouponWallet','giftsData','productFromItem','productRow','ShopDB']
          remain={x:s.count(x) for x in legacy if s.count(x)}
          if remain: raise SystemExit('legacy commerce residue: '+repr(remain))
          required=['xiaoshu-coupon-chat-card','red-packet-card','transfer-bubble','m.redPacket','m.transfer','收藏','朋友圈','相册','相机','电话','短信','callRecordsV2']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('current feature regression: '+repr(missing))
          p.write_text(s,encoding='utf-8')
          print('final Shop cleanup complete',len(before.encode('utf-8')),'->',len(s.encode('utf-8')))
          PY
      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --stat
          git commit -m "refactor: remove final Shop backup semantics"
          git push origin HEAD:main

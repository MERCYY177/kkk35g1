name: Call legacy migration regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/call-legacy-migration-regression.yml'
      - 'tools/test_call_legacy_migration.py'
      - 'tools/fix_call_legacy_migration.py'

permissions:
  contents: write

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run legacy call migration regression
        run: python tools/test_call_legacy_migration.py

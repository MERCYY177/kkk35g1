name: Diagnose 119 dropped canonical stickers

on:
  push:
    branches: [debug-sticker-runtime-20260921]
    paths:
      - '.github/workflows/fix-sticker-496-direct.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print pool filter definitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          for name in ['isImage','uniq','norm','buildPool','builtinSrcs']:
              pats=[r'function\s+'+name+r'\s*\([^)]*\)\s*\{',r'(?:var|let|const)\s+'+name+r'\s*=']
              pos=-1
              for pat in pats:
                  m=re.search(pat,s)
                  if m: pos=m.start(); break
              print('\n===',name,'===')
              print(s[pos:pos+2600] if pos>=0 else 'NOT FOUND')
          PY
      - name: Install Selenium
        run: python -m pip install --quiet selenium
      - name: Compare canonical 496 to real clean-browser pool
        shell: bash
        run: |
          cat > blank.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>blank</title>
          EOF
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          import re,json,shutil,collections,os
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script[^>]+id=["\']xiaoshu-builtin-sticker-packs-data-v1["\'][^>]*>(.*?)</script>',s,re.S|re.I)
          dta=json.loads(m.group(1)); refs=[]
          for p in dta:
              for i in p.get('items') or []:
                  if isinstance(i,dict) and str(i.get('src','')).strip(): refs.append(str(i['src']).strip())
          refs=list(dict.fromkeys(refs)); assert len(refs)==496
          chrome=shutil.which('google-chrome') or shutil.which('chromium') or shutil.which('chromium-browser')
          o=Options();o.binary_location=chrome
          for a in ['--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu']:o.add_argument(a)
          d=webdriver.Chrome(options=o)
          try:
              d.get('http://127.0.0.1:8000/blank.html')
              d.execute_script('localStorage.clear();sessionStorage.clear();')
              d.get('http://127.0.0.1:8000/index.html')
              WebDriverWait(d,20).until(lambda x:x.execute_script('return !!(window.xiaoshuStickerStore&&window.xiaoshuStickerStore.getPool)'))
              pool=d.execute_script('return window.xiaoshuStickerStore.getPool().slice();')
              hidden=d.execute_script('return window.xiaoshuStickerStore.getHidden().slice();')
              missing=[x for x in refs if x not in pool]
              extra=[x for x in pool if x not in refs]
              print('CANONICAL=',len(refs),'POOL=',len(pool),'HIDDEN=',len(hidden),'MISSING=',len(missing),'EXTRA=',len(extra))
              print('MISSING_SAMPLE:')
              for x in missing[:60]: print(x)
              ext=collections.Counter(os.path.splitext(x.split('?',1)[0])[1].lower() or '<none>' for x in missing)
              print('MISSING_EXTENSIONS',dict(ext))
              # Ask the page's own filter about every canonical ref.
              verdict=d.execute_script('return arguments[0].map(function(x){return {x:x,ok:(typeof isImage==="function"?isImage(x):null)};});',refs)
              bad=[v['x'] for v in verdict if v['ok'] is False]
              print('ISIMAGE_FALSE=',len(bad))
              for x in bad[:60]: print('BAD',x)
          finally:d.quit()
          PY

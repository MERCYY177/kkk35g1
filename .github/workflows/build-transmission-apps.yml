name: Build three local ChuanXun Android apps

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "*.js"
      - "*.css"
      - "*.json"
      - "assets/**"
      - "android-apps/**"
      - ".github/workflows/build-transmission-apps.yml"

permissions:
  contents: read

jobs:
  build-three-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build all three APKs in one Gradle invocation
        working-directory: android-apps
        run: >-
          gradle --no-daemon
          :app:assembleChuanxun1Debug
          :app:assembleChuanxun2Debug
          :app:assembleChuanxun3Debug

      - name: Verify APK package IDs and embedded local resources
        run: |
          set -euo pipefail
          mkdir -p release-apks
          cp android-apps/app/build/outputs/apk/chuanxun1/debug/app-chuanxun1-debug.apk release-apks/传讯1.apk
          cp android-apps/app/build/outputs/apk/chuanxun2/debug/app-chuanxun2-debug.apk release-apks/传讯2.apk
          cp android-apps/app/build/outputs/apk/chuanxun3/debug/app-chuanxun3-debug.apk release-apks/传讯3.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          python3 tests/verify_apk_bundle.py release-apks/传讯1.apk
          python3 tests/verify_apk_bundle.py release-apks/传讯2.apk
          python3 tests/verify_apk_bundle.py release-apks/传讯3.apk
          "$AAPT" dump badging release-apks/传讯1.apk | grep -F "package: name='com.mercyy.transmission'" >/dev/null
          "$AAPT" dump badging release-apks/传讯2.apk | grep -F "package: name='com.mercyy.transmission.new'" >/dev/null
          "$AAPT" dump badging release-apks/传讯3.apk | grep -F "package: name='com.mercyy177.chuanxun.three'" >/dev/null
          for apk in release-apks/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done
          sha256sum release-apks/*.apk | tee release-apks/SHA256SUMS.txt
          ls -lh release-apks

      - name: Upload three APKs
        uses: actions/upload-artifact@v4
        with:
          name: 传讯-三个独立本地APK
          path: release-apks/*
          if-no-files-found: error
          retention-days: 30

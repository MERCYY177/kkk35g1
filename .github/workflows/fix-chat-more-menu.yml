name: Fix chat more menu layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chat-more-menu.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move menu CSS into executable chat scope
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          circle_open = '<style id="xiaoshu-behavior-settings-v1-css">'
          call_open = '<style id="kkk35g-v118-chat-calls-css">'
          assert s.count(circle_open) == 1, f'expected one circle behavior style, got {s.count(circle_open)}'
          assert s.count(call_open) == 1, f'expected one main call style, got {s.count(call_open)}'

          def block(text, opener):
              start = text.index(opener)
              end = text.index('</style>', start) + len('</style>')
              return start, end, text[start:end]

          c0, c1, circle = block(s, circle_open)
          assert '.xs-chat-more-menu' in circle, 'precondition failed: misplaced menu CSS not found in circle text template'
          assert '#xs-chat-more-button{position:relative}' in circle, 'precondition failed: misplaced menu button CSS not found'

          # Remove only the chat-more rules from the text/plain Moments template;
          # keep the unrelated behavior-setting styles in that block.
          circle2 = re.sub(r'^#xs-chat-more-button\{position:relative\}\n', '', circle, count=1, flags=re.M)
          circle2 = re.sub(r'^\.xs-chat-more-menu\{[^\n]*\}\n', '', circle2, count=1, flags=re.M)
          circle2 = re.sub(r'^\.xs-chat-more-menu\.show\{[^\n]*\}\n', '', circle2, count=1, flags=re.M)
          assert '.xs-chat-more-menu' not in circle2, 'circle template still contains chat-more menu CSS'
          s = s[:c0] + circle2 + s[c1:]

          m0, m1, calls = block(s, call_open)
          assert '#xs-chat-more-menu' not in calls, 'precondition failed: main call style already contains menu CSS'
          anchor = '#xs-chat-more-button[hidden]{display:none!important}\n'
          assert calls.count(anchor) == 1, f'expected one insertion anchor, got {calls.count(anchor)}'

          menu_css = '''#xs-chat-more-menu{position:fixed!important;z-index:1000010!important;display:none!important;grid-template-columns:1fr!important;grid-auto-flow:row!important;width:184px!important;max-width:calc(100vw - 16px)!important;padding:8px!important;border:1px solid var(--border-color)!important;border-radius:14px!important;background:var(--secondary-bg)!important;box-shadow:0 14px 40px rgba(0,0,0,.22)!important;font-family:var(--font-family)!important;pointer-events:auto!important;isolation:isolate!important;box-sizing:border-box!important}\n#xs-chat-more-menu.show{display:grid!important;grid-template-columns:1fr!important;grid-auto-flow:row!important;gap:4px!important}\n#xs-chat-more-menu>button{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;width:100%!important;min-width:0!important;min-height:44px!important;margin:0!important;padding:0 12px!important;border:0!important;border-radius:10px!important;background:transparent!important;color:var(--text-primary)!important;font:inherit!important;text-align:left!important;white-space:nowrap!important;cursor:pointer!important;pointer-events:auto!important;touch-action:manipulation!important;box-sizing:border-box!important}\n#xs-chat-more-menu>button:hover,#xs-chat-more-menu>button:active{background:var(--primary-bg)!important}\n#xs-chat-more-menu>button>span{display:inline!important;visibility:visible!important;opacity:1!important;position:static!important;width:auto!important;height:auto!important;overflow:visible!important;font-size:inherit!important;line-height:1.2!important;color:inherit!important}\n#xs-chat-more-menu>button>i{display:inline-flex!important;align-items:center!important;justify-content:center!important;width:18px!important;min-width:18px!important;flex:0 0 18px!important;text-align:center!important}\n'''
          calls2 = calls.replace(anchor, anchor + menu_css, 1)
          s = s[:m0] + calls2 + s[m1:]

          # Scope-aware verification: do not merely search the whole file.
          _, _, final_circle = block(s, circle_open)
          _, _, final_calls = block(s, call_open)
          assert 'xs-chat-more-menu' not in final_circle, 'FAIL: menu CSS remains inside circle text/plain template'
          required = [
              '#xs-chat-more-menu{position:fixed!important',
              '#xs-chat-more-menu.show{display:grid!important;grid-template-columns:1fr!important;grid-auto-flow:row!important',
              '#xs-chat-more-menu>button{display:flex!important;flex-direction:row!important',
              '#xs-chat-more-menu>button>span{display:inline!important;visibility:visible!important;opacity:1!important',
          ]
          for token in required:
              assert token in final_calls, f'FAIL: executable call style missing {token}'
          assert 'data-v118-more-call="voice"' in s
          assert 'data-v118-more-call="video"' in s
          assert 'data-v118-more-settings' in s

          p.write_text(s, encoding='utf-8')
          print('PASS: misplaced circle-template menu CSS removed')
          print('PASS: executable main-call menu CSS installed')
          print('PASS: one-column layout and visible labels asserted in correct style block')
          PY
          git diff --check
          git diff --stat
      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: render chat more menu vertically'
          git push

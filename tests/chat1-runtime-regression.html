<!doctype html>
<meta charset="utf-8">
<title>Chat1 runtime regression tests</title>
<script src="../behavior-core.js"></script>
<body data-status="running"><pre id="result">RUNNING</pre></body>
<script>
(function () {
  'use strict';
  var failures = [];
  var passed = 0;
  function test(name, fn) {
    try { fn(); passed += 1; }
    catch (error) { failures.push(name + ': ' + (error && error.message || error)); }
  }
  function equal(actual, expected, message) {
    if (actual !== expected) throw new Error((message || 'values differ') + ' (actual=' + actual + ', expected=' + expected + ')');
  }
  function ok(value, message) { if (!value) throw new Error(message || 'expected truthy value'); }
  function api() { ok(window.XiaoshuBehaviorCore, 'XiaoshuBehaviorCore must load'); return window.XiaoshuBehaviorCore; }

  test('one reply consumes the configured delay exactly once', function () {
    var plan = api().buildConversationReplySchedule(1, 3000, 7000, function () { return 0; });
    equal(plan.replyDelays.length, 1);
    equal(plan.replyDelays[0], 3000);
  });

  test('fixed one two and three replies only accumulate per-message delays', function () {
    [1, 2, 3].forEach(function (count) {
      var plan = api().buildConversationReplySchedule(count, 3000, 7000, function () { return 0; });
      equal(plan.replyDelays[count - 1], count * 3000, 'no outer full delay for count ' + count);
    });
  });

  test('combined reply has one delay and partner sticker follows in 200 to 600ms', function () {
    var plan = api().buildConversationReplySchedule(1, 3000, 7000, function () { return 0.5; });
    equal(plan.replyDelays.length, 1);
    equal(plan.replyDelays[0], 5000);
    equal(plan.stickerDelay, 400);
    ok(plan.stickerDelay >= 200 && plan.stickerDelay <= 600);
  });

  test('bottom anchor restores to the new bottom after viewport height changes', function () {
    var anchor = api().captureChatScrollAnchor({ scrollHeight: 1200, clientHeight: 500, scrollTop: 700 }, false);
    equal(anchor.nearBottom, true);
    equal(api().restoreChatScrollTop(anchor, { scrollHeight: 1200, clientHeight: 300 }), 900);
  });

  test('history anchor preserves distance from bottom after viewport height changes', function () {
    var anchor = api().captureChatScrollAnchor({ scrollHeight: 1200, clientHeight: 500, scrollTop: 420 }, true);
    equal(anchor.distanceFromBottom, 280);
    equal(anchor.userBrowsingHistory, true);
    equal(api().restoreChatScrollTop(anchor, { scrollHeight: 1300, clientHeight: 300 }), 720);
  });

  test('content growth from image load keeps a bottom reader at bottom', function () {
    var anchor = api().captureChatScrollAnchor({ scrollHeight: 1000, clientHeight: 500, scrollTop: 500 }, false);
    equal(api().restoreChatScrollTop(anchor, { scrollHeight: 1100, clientHeight: 500 }), 600);
  });

  test('content growth from image load preserves a history reader distance', function () {
    var anchor = api().captureChatScrollAnchor({ scrollHeight: 1000, clientHeight: 500, scrollTop: 250 }, true);
    equal(api().restoreChatScrollTop(anchor, { scrollHeight: 1100, clientHeight: 500 }), 350);
  });

  test('programmatic restore is explicitly marked for history-load suppression', function () {
    var anchor = api().captureChatScrollAnchor({ scrollHeight: 1000, clientHeight: 500, scrollTop: 250 }, true);
    equal(anchor.suppressHistoryLoad, true);
  });

  var result = document.getElementById('result');
  if (failures.length) {
    document.body.dataset.status = 'failed';
    result.textContent = 'FAIL ' + failures.length + '\n' + failures.join('\n');
  } else {
    document.body.dataset.status = 'passed';
    result.textContent = 'PASS ' + passed;
  }
})();
</script>

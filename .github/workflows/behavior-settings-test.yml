name: Behavior settings test

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'tools/test_behavior_settings.py'
      - '.github/workflows/behavior-settings-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_behavior_settings.py

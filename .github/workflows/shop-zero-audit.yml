name: Zero Shop residual audit

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining Shop compatibility structures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, collections
          s=Path('index.html').read_text(encoding='utf-8')
          lines=s.splitlines()

          exact=['ShopDB','xiaoshu_shop_','coupon_wallet','gift_cabinet','productFromItem','productRow','xs-product-',
                 'renderWallet','showCouponWallet','giftsData','ta-phone-product-card','order-product','xsShopCardEsc',
                 'xsHasRealShopCardHtml','data-shop-card','xs-shop-share-card','isShopCardMessage','xsProductFromShareMessage',
                 'xsShopCardTagFromMessage','xsRenderShopCardFromMessage','shop-chat-card','xiaoshu-coupon-chat-card',
                 'xiaoshu-coupon-tab','xs-gift-time-line','xiaoshu-ta-phone-collections-and-gifts-v1-js']
          print('=== residual counts ===')
          for x in exact:
              c=s.count(x)
              if c: print(repr(x),c)

          for a,b in [(3530,3620),(17405,17530),(17610,17765),(18925,18955),(20980,21010)]:
              print(f'\n=== L{a}-L{b} ===')
              for i in range(a-1,min(b,len(lines))):
                  text=lines[i]
                  if len(text)>2200: text=text[:2200]+' …'
                  print(f'L{i+1}: {text}')

          print('\n=== unique windows around ta-phone-product-card / order-product ===')
          windows=[]
          for token in ['ta-phone-product-card','order-product']:
              seen=set()
              for m in re.finditer(re.escape(token),s):
                  w=s[max(0,m.start()-220):min(len(s),m.end()+300)].replace('\n',' ')
                  w=re.sub(r'\s+',' ',w)
                  if w not in seen:
                      seen.add(w); windows.append((token,w))
                  if len(seen)>=30: break
          for token,w in windows[:60]: print(token+': '+w)

          print('\n=== shop-ish function/identifier declarations ===')
          rx=re.compile(r'\b(?:function\s+|(?:var|let|const)\s+)([A-Za-z_$][A-Za-z0-9_$]*(?:Shop|shop|Product|product|Coupon|coupon|Wallet|wallet|Gift|gift|Cart|cart)[A-Za-z0-9_$]*)')
          for name in sorted(set(rx.findall(s))): print(name)

          raise SystemExit('inspection run complete (intentional red)')
          PY
name: Diagnose current chat defects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-drawer-beautify.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate exact functions and registries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          def extract_function(name,occ=0):
              ms=list(re.finditer(r'function\s+'+re.escape(name)+r'\s*\([^)]*\)\s*\{',s))
              out.append(f'\n=== function {name} matches={len(ms)} ===')
              if len(ms)<=occ:return
              m=ms[occ]; start=m.start(); brace=s.find('{',m.start(),m.end()+2); depth=0; quote=None; esc=False; i=brace
              while i<len(s):
                  c=s[i]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0:
                              out.append(s[start:i+1]); return
                  i+=1
              out.append(s[start:start+5000])
          for name in ['getPool','syncRuntime','hydrate','appendStickerBatch','bindStickerGrid','openStickers','normalizeSharedStickerPool','renderSharedStickerGrid','registerChat2Sticker','resolveChat2Sticker','safeResourceUrl']:
              extract_function(name)
          # Nearby definitions around canonical sticker store assignment.
          pos=s.find('window.xiaoshuStickerStore=api')
          out.append('\n=== STICKER STORE ASSIGNMENT WINDOW ===')
          out.append(s[max(0,pos-10000):pos+2200] if pos>=0 else 'not found')
          # All named functions containing reject/decline/call status tokens, compact windows.
          out.append('\n=== CALL REJECT WINDOWS ===')
          callp=re.compile(r'reject|decline|拒绝|callStatus|callRecord|call-status|call-record',re.I)
          seen=[]
          for m in callp.finditer(s):
              if seen and m.start()-seen[-1]<1200: continue
              seen.append(m.start()); out.append(f'--- @{m.start()} ---\n'+s[max(0,m.start()-1400):min(len(s),m.start()+2400)])
              if len(seen)>=25:break
          # Exact call-record CSS declaration block(s).
          out.append('\n=== CALL RECORD CSS ===')
          for selector in ['.xs-main-call-record{','.xs-main-call-record-main{','.xs-main-call-record-status{']:
              p=0
              while True:
                  p=s.find(selector,p)
                  if p<0:break
                  e=s.find('}',p)
                  out.append(s[p:e+1]);p=e+1
          # Beauty registry structural comparison.
          out.append('\n=== BEAUTY REGISTRY STRUCTURE ===')
          m=re.search(r'<script id="xiaoshu-builtin-bubble-css-data" type="application/json">(.*?)</script>',s,re.S)
          km=re.search(r'const BUILTIN_KEYBOARD_BEAUTY_STYLES=(\[.*?\]);\s*let editingKeyboardBeautyId',s,re.S)
          main=json.loads(m.group(1)) if m else []
          kb=json.loads(km.group(1)) if km else []
          out.append('chat1 count='+str(len(main))+' keys='+repr(sorted(set().union(*[set(x.keys()) for x in main]) if main else [])))
          out.append('chat2 count='+str(len(kb))+' keys='+repr(sorted(set().union(*[set(x.keys()) for x in kb]) if kb else [])))
          def body(n):return re.sub(r'^\d{1,2}[_. -]*','',str(n or ''))
          m1={body(x.get('name')):x for x in main};m2={body(x.get('name')):x for x in kb}
          out.append('only_chat1='+repr(sorted(set(m1)-set(m2))))
          out.append('only_chat2='+repr(sorted(set(m2)-set(m1))))
          out.append('common='+str(len(set(m1)&set(m2))))
          for n in sorted(set(m2)-set(m1))[:30]:
              x=m2[n];out.append('CHAT2_ONLY '+n+' '+repr({k:(str(v)[:500] if isinstance(v,str) else v) for k,v in x.items()}))
          # Locate beauty state application/bridge functions.
          for name in ['applyParentBeautyImport','applyActiveKeyboardBeauty','kkk35gMigrateLegacyBeautyState','applyTheme']:
              extract_function(name)
          # Main drawer function and touch handlers.
          for name in ['openDrawer','ensureDrawer','touchMove','touchEnd','closeDrawer']:
              extract_function(name)
          text='\n'.join(out)
          Path('_diag_targeted.txt').write_text(text,encoding='utf-8')
          print('targeted chars',len(text))
          print(text[:12000])
          PY
      - name: Commit targeted diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _diag_targeted.txt
          git commit -m 'test: record targeted defect functions'
          git push

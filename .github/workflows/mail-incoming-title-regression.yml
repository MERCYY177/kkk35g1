name: Mail incoming title regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mail-incoming-title-regression.yml'
      - 'tools/test_mail_incoming_title.py'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run incoming mail title regression
        run: python tools/test_mail_incoming_title.py

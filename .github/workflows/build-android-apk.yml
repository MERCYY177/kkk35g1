name: Build Chuanxun Android APK

on:
  push:
    branches:
      - android-apk-build
    paths:
      - "index.html"
      - "behavior-core.js"
      - "media-core.js"
      - "sticker-core.js"
      - "assets/**"
      - "android-wrapper/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chuanxun-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Reuse debug signing key for future test APK updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chuanxun-debug-keystore-v1-linux

      - name: Ensure stable Android debug signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Apply Android system-font behavior to the bundled web app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          original = html

          # Replace the old named-font stack with Android's generic sans-serif family.
          stack_pattern = re.compile(
              r'system-ui\s*,\s*-apple-system\s*,\s*BlinkMacSystemFont\s*,\s*"Segoe UI"\s*,\s*"PingFang SC"\s*,\s*"Hiragino Sans GB"\s*,\s*"Microsoft YaHei"\s*,\s*sans-serif',
              re.IGNORECASE,
          )
          html, stack_count = stack_pattern.subn("sans-serif", html)
          if stack_count < 5:
              raise SystemExit(f"Expected at least five default font stacks; found {stack_count}")

          # Migrate the old value already stored in local app settings to generic system sans-serif.
          settings_marker = 'window.settings = settings; // 暴露到 window，供 home.js 等模块读取'
          if html.count(settings_marker) != 1:
              raise SystemExit(f"Expected one settings marker; found {html.count(settings_marker)}")
          migration = r'''try {
            const __xsSavedFontFamily = String(settings.messageFontFamily || '').trim();
            const __xsWasLegacySystemStack = /system-ui/i.test(__xsSavedFontFamily) &&
              /sans-serif/i.test(__xsSavedFontFamily) &&
              /(?:PingFang SC|Microsoft YaHei|Segoe UI|Hiragino Sans GB)/i.test(__xsSavedFontFamily);
            if (!settings.customFontUrl && (!__xsSavedFontFamily || __xsWasLegacySystemStack || /Noto\s+Serif\s+SC/i.test(__xsSavedFontFamily))) {
              settings.messageFontFamily = 'sans-serif';
            }
            if (!settings.customFontUrl) {
              document.documentElement.setAttribute('data-follow-system-font', 'true');
            } else {
              document.documentElement.removeAttribute('data-follow-system-font');
            }
          } catch (e) {}'''
          html = html.replace(settings_marker, migration + "\n" + settings_marker, 1)

          # Apply after any saved custom styles; leave the icon-font families and SVG artwork intact.
          style_marker = '} catch(e) { console.warn("样式应用失败", e); }\nif (savedPokes) customPokes = savedPokes;'
          if html.count(style_marker) != 1:
              raise SystemExit(f"Expected one style marker; found {html.count(style_marker)}")
          enforcer = r''' } catch(e) { console.warn("样式应用失败", e); }
          try {
            if (!settings.customFontUrl) {
              const __xsStyleId = 'xiaoshu-follow-android-system-font';
              let __xsFontStyle = document.getElementById(__xsStyleId);
              if (!__xsFontStyle) {
                __xsFontStyle = document.createElement('style');
                __xsFontStyle.id = __xsStyleId;
                document.head.appendChild(__xsFontStyle);
              }
              __xsFontStyle.textContent = 'html[data-follow-system-font="true"],html[data-follow-system-font="true"] body,html[data-follow-system-font="true"] body *:not(.fa):not(.fas):not(.far):not(.fab):not(.fa-solid):not(.fa-regular):not(.fa-brands):not(.fa-classic):not([class^="fa-"]):not([class*=" fa-"]):not(.material-icons):not(.material-symbols-outlined):not(svg):not(path){font-family:sans-serif !important;}';
            }
          } catch (e) {}
          if (savedPokes) customPokes = savedPokes;'''
          html = html.replace(style_marker, enforcer, 1)

          if html == original:
              raise SystemExit("Android system-font patch made no changes")
          path.write_text(html, encoding="utf-8")
          print(f"Applied system font patch: {stack_count} stack replacements; output {len(html)} characters")
          PY
      - name: Bundle the full website and sticker assets into the app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-wrapper/app/src/main/assets/www
          cp index.html behavior-core.js media-core.js sticker-core.js android-wrapper/app/src/main/assets/www/
          cp -R assets android-wrapper/app/src/main/assets/www/assets
          test -f android-wrapper/app/src/main/assets/www/index.html
          test -f android-wrapper/app/src/main/assets/www/sticker-core.js
          test -d android-wrapper/app/src/main/assets/www/assets/stickers
          echo "Bundled web project size:"
          du -sh android-wrapper/app/src/main/assets/www

      - name: Build APK
        run: gradle --no-daemon -p android-wrapper assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chuanxun-android-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

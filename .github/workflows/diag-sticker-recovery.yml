name: Diagnose sticker recovery

on:
  push:
    paths:
      - '.github/workflows/diag-sticker-recovery.yml'
      - 'tools/test_sticker_recovery.py'
      - 'index.html'
      - 'assets/stickers/**'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run sticker recovery regression
        run: python tools/test_sticker_recovery.py
